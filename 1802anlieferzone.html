<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>anlieferzone</title>

<style>
  @font-face{
    font-family:"g1";
    src:url("fonts/g1.ttf") format("truetype");
    font-weight:100 900;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --green:#00ff00;
    --ui-z:2147483647;
  }

  body{ margin:0; background:var(--green); }

  /* ===== GRID ===== */
  .grid{
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    position:relative;
    z-index:1;
  }
  .cell{ position:relative; }
  .cell{ position:relative; z-index:0; }
.cell.isHoverTop{ z-index:9999; }

  .cell img{ width:100%; height:auto; display:block; }

  /* ===== HOVER ===== */
  .hover{
    position:absolute;
    top:0; left:0;
    display:none;
    z-index:20;
  }
  .hover img{
    width:150px;
    cursor:pointer;
    display:block;
  }

  /* ===== TRACK OVERLAY ===== */
  #trackOverlay{
    position:fixed;
    inset:0;
    display:none;
    z-index:2600;
    background:rgba(0,0,0,0); /* transparent aber klickbar */
  }

  #trackBg{
    position:absolute;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:contain;
    z-index:0;
    pointer-events:none;
    display:block;
  }

  #trackOverlay svg{
    position:absolute;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
    z-index:1;
  }

  #trackOverlay svg,
  #trackBg{
    transform-origin:center center;
  }

  /* ===== HUD ===== */
  #raceHud{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:var(--ui-z);
    font-family:"g1", sans-serif;
    color:var(--green);
    text-shadow:0 6px 18px rgba(0,0,0,0.35);
    user-select:none;
    pointer-events:none;
    text-transform:uppercase;
    letter-spacing:0.02em;
    display:none;
    text-align:center;
  }
  #raceCountdown{ font-size:96px; line-height:0.95; margin-bottom:10px; display:none; }
  #raceTimers{ font-size:44px; line-height:1.05; }
  #raceTimers .tRow{ margin:6px 0; }
  #raceScore{ margin-top:12px; font-size:34px; line-height:1.05; display:none; }

  /* ===== PLAYERS ===== */
  .player{
    position:fixed;
    z-index:2147483646;
    display:none;
    pointer-events:none;
    user-select:none;
    transform:translate(-50%,-50%) scale(0.82);
    transform-origin:center center;
  }
  #lkw{ width:90px; }
  #car{ width:70px; }

  /* ===== COORDS ===== */
  #coords{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:var(--ui-z);
    color:#000;
    font-family:"g1", sans-serif;
    font-size:22px;
    line-height:1.1;
    user-select:none;
    pointer-events:none;
    white-space:pre;
  }

  /* ===== BOTTOM AREA ===== */
  #bottomArea{
    position:relative;
    width:100%;
    min-height:320px;
    background:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px 70px;
    box-sizing:border-box;
  }
  #bottomButtons{
    display:flex;
    flex-direction:column;
    gap:14px;
    align-items:center;
    justify-content:center;
  }
  .bigBtn{
    border:none;
    background:transparent;
    color:#000;
    font-family:"g1", sans-serif;
    font-size:64px;
    line-height:0.95;
    cursor:pointer;
    padding:0;
    text-transform:uppercase;
  }
  .bigBtn:active{ transform:translateY(1px); }
#blackBox{
  position:absolute;     /* hängt am #bottomArea */
  right:70px;            /* Abstand zur rechten Kante wie am Anfang */
  bottom:0;              /* klebt an der unteren Kante vom BottomArea */
  width:260px;
  height:150px;
  background:#000;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}


/* Preview-Bild im Kasten */
#blackPreview{
  width:100%;
  height:100%;
  object-fit:contain;      /* passt komplett rein */
  display:block;
  pointer-events:none;
  user-select:none;
}


  /* ===== PANEL ===== */
  #panelOverlay{
    position:fixed;
    inset:0;
    display:none;
    z-index:2000;
    background:rgba(0,0,0,0.25);
  }
  #panel{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(1100px, 92vw);
    height:min(720px, 86vh);
    background:rgba(255,255,255,0.92);
    border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  #panelHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid rgba(0,0,0,0.12);
  }
  #panelTitle{
    font-family:"g1", sans-serif;
    font-size:28px;
    color:#000;
    margin:0;
    text-transform:uppercase;
  }
  #panelClose{
    border:none;
    background:transparent;
    font-family:"g1", sans-serif;
    font-size:24px;
    cursor:pointer;
    color:#000;
  }
  #panelBody{
    padding:16px;
    overflow:auto;
    flex:1;
    color:#000;
    font-family:system-ui, sans-serif;
  }

  /* ===== TRACKS GRID ===== */
  .trackList{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
    gap:18px;
    align-items:start;
  }
  .trackItem{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:10px 8px;
    border:1px solid rgba(0,0,0,0.12);
    border-radius:12px;
    background:rgba(255,255,255,0.7);
    cursor:pointer;
    user-select:none;
  }
  .trackSvg{ width:100%; height:auto; display:block; }
  .trackName{
    font-family:"g1", sans-serif;
    font-size:28px;
    line-height:1;
    color:#000;
    text-transform:uppercase;
  }

  /* ===== ARTEFAKT VIEWER ===== */
  #arteOverlay{
    position:fixed;
    inset:0;
    display:none;
    z-index:2500;
    background:#fff;
  }
  #arteStage{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:visible;
    perspective:1200px;
  }
  #arteImg{
    max-width:min(78vw, 980px);
    max-height:72vh;
    width:auto;
    height:auto;
    display:block;
    user-select:none;
    pointer-events:none;
    position:relative;
    z-index:2;
  }
  .arteSide{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:min(46vw, 560px);
    max-height:60vh;
    height:auto;
    opacity:0.55;
    pointer-events:none;
    user-select:none;
    z-index:1;
    filter:drop-shadow(0 18px 36px rgba(0,0,0,0.18));
  }
  #arteImgPrev{ left:-14vw; transform:translateY(-50%) scale(0.72) rotateY(22deg); }
  #arteImgNext{ right:-14vw; transform:translateY(-50%) scale(0.72) rotateY(-22deg); }

  #arteLabel{
    position:absolute;
    left:50%;
    top:56%;
    transform:translate(-50%, 0);
    font-family:"g1", sans-serif;
    font-size:84px;
    color:var(--green);
    text-transform:uppercase;
    letter-spacing:0.02em;
    pointer-events:none;
    user-select:none;
    text-shadow:0 6px 18px rgba(0,0,0,0.25);
    z-index:3;
  }
  .arteArrow{
    position:absolute;
    top:26%;
    width:92px;
    height:92px;
    border:none;
    background:transparent;
    cursor:pointer;
    user-select:none;
    z-index:4;
  }
  .arteArrow::before{
    content:"";
    position:absolute;
    inset:0;
    margin:auto;
    width:0;
    height:0;
    border-top:22px solid transparent;
    border-bottom:22px solid transparent;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,0.25));
  }
  #artePrev{ left:70px; }
  #artePrev::before{ border-right:40px solid var(--green); left:26px; }
  #arteNext{ right:70px; }
  #arteNext::before{ border-left:40px solid var(--green); right:26px; }

  #arteClose{
    position:absolute;
    right:22px;
    top:16px;
    border:none;
    background:transparent;
    font-family:"g1", sans-serif;
    font-size:28px;
    cursor:pointer;
    color:#000;
    z-index:5;
  }

  /* ===== WEATHER CANVAS ===== */
#weatherCanvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:1500;
  pointer-events:none;
  display:block;
  opacity:1;
}

/* ===== TYPEWRITER TEXT (TOP-LEFT, FRONT LAYER, 4 COLUMNS) ===== */
#typeOverlay{
  position:fixed;
  inset:0;
  display:none;            /* wird im idle gesteuert */
  z-index:9999999;         /* immer ganz vorne */
  pointer-events:none;
  padding:24px;            /* Randabstand */
  box-sizing:border-box;
}

#typeText{
  font-family:"g1", sans-serif;
  color:var(--green);
  font-weight:800;      /* weight */
  color:var(--green);
  font-size:20px;
  line-height:1.05;
  letter-spacing:0.01em;
  text-transform:none;
  text-align:left;
}

#typeGrid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:28px;
  align-items:start;
  width:100%;
}

.typeCol{
  min-height:1px;
}

.colContent{
  white-space:pre-wrap;     /* wir arbeiten mit echten \n */
  word-break:break-word;
}

/* Cursor: wird per JS an die richtige Spalte “gezogen” */
#typeCursor{
  display:none;             /* nur sichtbar während typing */
  position:absolute;
  animation:typeBlink 0.9s steps(1) infinite;
}

@keyframes typeBlink{
  0%,49%{opacity:1;}
  50%,100%{opacity:0;}
}

/* Typewriter: bis fast an den Rand */
#typeOverlay{
  padding: 24px;          /* Randabstand: kleiner = näher am Rand */
  box-sizing: border-box;
}

#typeContent{
  width: 100%;
  max-width: none;        /* ✅ keine Begrenzung */
  white-space: pre-wrap;  /* Zeilen umbrechen */
  word-break: break-word; /* lange Wörter umbrechen */
}

/* ===== READING MODE: gray background + grid drift ===== */
body{
  transition: background-color 1.2s ease;
}

/* wenn Text läuft */
body.reading{
  background:#bdbdbd; /* grau */
}

/* Grid driftet weich */
.grid{
  transition: transform 1.6s ease, filter 1.6s ease, opacity 1.6s ease;
  will-change: transform;
}

/* optional: Grid im Reading-Mode etwas "wegdimmen" */
body.reading .grid{
  filter: blur(0.2px);
  opacity: 0.92;
}

/* Zellen: wir steuern Drift pro Zelle über CSS-Variablen */
.cell{
  transform: translate(var(--dx, 0px), var(--dy, 0px));
  transition: transform 1.6s ease;
  will-change: transform;
}

/* ===== IDLE VISUALS: grey background + grid drift ===== */
body{
  transition: background 1200ms ease;
}

body.idle{
  background:#8b8b8b; /* grau */
}

/* optional: Bildraster im Idle etwas “staubiger” */
body.idle .grid{
  filter: grayscale(1) contrast(1.05) brightness(0.92);
  transition: filter 1200ms ease;
}

/* wichtig: Hover bleibt sichtbar über den Zellen */
.cell{ overflow:visible; }
.hover{ z-index:50; }


</style>

<body>
  <div class="grid" id="grid"></div>

<!-- Typewriter text overlay (4 columns) -->
<div id="typeOverlay" aria-hidden="true">

</div>

<script>
/* =========================
   MASTER AMBIENT 172.wav (start on first interaction)
   - stops in idle
   ========================= */
const masterAmbient = (() => {
  let unlocked = false;
  const a = new Audio("audio/172.wav");
  a.loop = true;
  a.preload = "auto";
  a.volume = 1.0;

  async function tryPlay(){
    if (!unlocked) return;
    try { await a.play(); } catch {}
  }

  function unlockAndPlay(){
    if (!unlocked) unlocked = true;
    tryPlay();
  }

  function stop(){
    try { a.pause(); a.currentTime = 0; } catch {}
  }

  // erster Klick unlockt Audio im Browser + startet 172
  window.addEventListener("pointerdown", unlockAndPlay, { passive:true });

  return { tryPlay, stop };
})();


/* =========================
   AUDIO MANAGER (Vehicle stack + Weather)
   ========================= */
const VEHICLE_SOUNDS = [
  "audio/motor1.wav",
  "audio/motorrad1.wav",
  "audio/lkw1.wav",
  "audio/lkw2.wav",
];

const WEATHER_SOUNDS = {
  rain: "audio/regen1.wav",
  wind: "audio/wind1.wav",
};

let vehicleStack = [];     // Array<Audio>
let weatherAudio = null;   // Audio|null

function pick(arr){ return arr[(Math.random()*arr.length)|0]; }

function playLoop(src, volume=1.0){
  const a = new Audio(src);
  a.loop = true;
  a.preload = "auto";
  a.volume = volume;
  a.play().catch(()=>{ /* autoplay kann blocken; dein 172.wav pointerdown unlockt meist */ });
  return a;
}

// --- Vehicle stack ---
function playRandomVehicleSound(){
  const src = pick(VEHICLE_SOUNDS);
  // etwas leiser, weil mehrere stacken können
  const a = playLoop(src, 0.55);
  vehicleStack.push(a);
}

function stopAllVehicleSounds(){
  for (const a of vehicleStack){
    try { a.pause(); a.currentTime = 0; } catch {}
  }
  vehicleStack.length = 0;
}

// --- Weather audio ---
function playWeather(src){
  stopWeather();
  if (!src) return;
  weatherAudio = playLoop(src, 0.8);
}

function stopWeather(){
  if (!weatherAudio) return;
  try { weatherAudio.pause(); weatherAudio.currentTime = 0; } catch {}
  weatherAudio = null;
}


// ===== IDLE MODE (5s ohne Input) + Events =====
(() => {
  const IDLE_MS = 5000;
  let idleTimer = null;
  let isIdle = false;

  function setIdle(on){
    if (isIdle === on) return;
    isIdle = on;
    document.body.classList.toggle("idle", on);

    // Events für Wetter/Animationen
    window.dispatchEvent(new CustomEvent("idlechange", { detail:{ idle:on } }));
    if (on) window.dispatchEvent(new Event("idleenter"));
    else window.dispatchEvent(new Event("idleleave"));
  }

  function bump(){
    setIdle(false);
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => setIdle(true), IDLE_MS);
  }

  ["pointerdown","pointermove","mousemove","keydown","wheel","touchstart"].forEach(ev=>{
    window.addEventListener(ev, bump, { passive:true });
  });

  bump();
})();



/* =========================
   Helpers: IDs A1..J10
   ========================= */
 /* =========================
  
 
/* =========================
   TYPEWRITER (4 columns, 20 lines each)
   - starts after 20s IDLE
   - stops immediately on activity
   - loads text/anlieferzone.txt
   - triggers "typewriterstart" for clouds
   ========================= */
(() => {
  const overlay = document.getElementById("typeOverlay");
  const grid = document.getElementById("typeGrid");
  const cols = [
    document.getElementById("col0"),
    document.getElementById("col1"),
    document.getElementById("col2"),
    document.getElementById("col3"),
  ];
  const cursorEl = document.getElementById("typeCursor");
  if (!overlay || !grid || cols.some(x=>!x) || !cursorEl) return;

  // ---- Settings ----
  const START_AFTER_IDLE_MS = 2000; // ✅ 20s idle
  const LINES_PER_COL = 20;          // ✅ nach 20 Zeilen nächste Spalte
  const COLS = 4;

  let idleDelayTimer = null;
  let timer = null;

  let fullText = "";
  let typed = "";       // “bereits getippt”
  let lines = [""];     // array von Zeilen-Strings (mit Umbruch-Logik)
  let lineIndex = 0;

  function show(){ overlay.style.display = "block"; }
  function hide(){ overlay.style.display = "none"; }

  function stopTyping(){
    if (idleDelayTimer){ clearTimeout(idleDelayTimer); idleDelayTimer = null; }
    if (timer){ clearTimeout(timer); timer = null; }
    typed = "";
    lines = [""];
    lineIndex = 0;
    cols.forEach(c => c.textContent = "");
    cursorEl.style.display = "none";
    hide();
  }

  // ---- Idle scheduling ----
  function scheduleStartAfterIdle(){
    if (idleDelayTimer) clearTimeout(idleDelayTimer);
    idleDelayTimer = setTimeout(async () => {
      try{
        if (!fullText) fullText = await loadText();
        startTyping();
      }catch(err){
        console.warn(err);
      }
    }, START_AFTER_IDLE_MS);
  }

  // ---- Fetch text ----
  async function loadText(){
    const res = await fetch("text/anlieferzone.txt", { cache:"no-store" });
    if (!res.ok) throw new Error("Text nicht gefunden: text/anlieferzone.txt");
    const raw = await res.text();
    return String(raw).replace(/\r/g,"").trim();
  }

  // ---- Soft/human-ish timing ----
  function rand(a,b){ return a + Math.random()*(b-a); }
  function charDelay(ch, prev){
    let d = rand(18, 55);
    if (ch === " ") d += rand(10, 35);
    if (ch === "," || ch === ";" || ch === ":") d += rand(140, 260);
    if (ch === "." || ch === "!" || ch === "?") d += rand(260, 520);
    if (ch === "\n") d += rand(380, 820);
    if (prev === "." && ch === " ") d += rand(120, 240);
    return d;
  }

  // ---- Line wrapping by width (real pixels) ----
  const meas = document.createElement("canvas").getContext("2d");
  function setMeasureFont(){
    const cs = getComputedStyle(document.getElementById("typeText"));
    meas.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  }

  function maxLineWidthPx(){
    // 4 columns + gaps => use one column's width
    const col0 = cols[0].parentElement;
    return Math.max(60, col0.getBoundingClientRect().width);
  }

  function pushCharIntoLines(ch){
    // newline forced
    if (ch === "\n"){
      lines.push("");
      lineIndex++;
      return;
    }

    const wMax = maxLineWidthPx();
    const current = lines[lineIndex] ?? "";
    const test = current + ch;

    // if would overflow -> new line (but don't break if current empty)
    if (current && meas.measureText(test).width > wMax){
      lines.push(ch === " " ? "" : ch);
      lineIndex++;
    }else{
      lines[lineIndex] = test;
    }
  }

  // ---- Render into 4 cols (20 lines each) ----
  function render(){
    for (let ci=0; ci<COLS; ci++){
      const from = ci * LINES_PER_COL;
      const to = from + LINES_PER_COL;
      cols[ci].textContent = lines.slice(from, to).join("\n");
    }
    positionCursor();
  }

  function positionCursor(){
    // cursor only visible while typing
    cursorEl.style.display = "inline-block";

    // which line are we on?
    const totalLine = lineIndex; // 0-based
    const colIndex = Math.min(COLS-1, Math.floor(totalLine / LINES_PER_COL));
    const rowInCol = totalLine % LINES_PER_COL;

    // measure caret position in that column by using a hidden range trick:
    const colSpan = cols[colIndex];
    const colWrap = colSpan.parentElement;

    // create a temporary marker at end of the current line
    // We can approximate by putting cursor at bottom of col content end:
    const rectCol = colSpan.getBoundingClientRect();
    const rectWrap = colWrap.getBoundingClientRect();

    // Find the y-position of the row in the column using line-height:
    const cs = getComputedStyle(document.getElementById("typeText"));
    const lh = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) * 1.05);
    const x = rectWrap.left + rectWrap.width; // end of column (approx)
    const y = rectCol.top + (rowInCol * lh);

    cursorEl.style.position = "fixed";
    cursorEl.style.left = (x + 6) + "px";
    cursorEl.style.top  = (y) + "px";
  }

  function startTyping(){
    if (!fullText) return;

    show();
    cols.forEach(c => c.textContent = "");
    cursorEl.style.display = "inline-block";

    typed = "";
    lines = [""];
    lineIndex = 0;

    setMeasureFont();
    window.dispatchEvent(new Event("typewriterstart"));

    if (timer){ clearTimeout(timer); timer = null; }

    let i = 0;

    const step = () => {
      if (i >= fullText.length){
        timer = null;
        cursorEl.style.display = "none";
        return;
      }

      const ch = fullText[i];
      const prev = i > 0 ? fullText[i-1] : "";

      typed += ch;
      pushCharIntoLines(ch);

      // stop after 4 cols * 20 lines (wenn du “mehr Text” willst, sag Bescheid)
      const maxLines = COLS * LINES_PER_COL;
      if (lines.length > maxLines){
        cursorEl.style.display = "none";
        timer = null;
        return;
      }

      render();

      i++;
      timer = setTimeout(step, charDelay(ch, prev));
    };

    timer = setTimeout(step, rand(120, 240));
  }

  // ---- Idle hooks ----
  window.addEventListener("idleenter", () => {
    scheduleStartAfterIdle();
  });

  window.addEventListener("idleleave", () => {
    stopTyping();
  });

})();

function idFromIndex(i){

}

const TRACK_HALF_WIDTH = 40;   // <- höher = "breiter"

function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function wrap(s,len){
  if (len<=0) return 0;
  s = s % len;
  if (s<0) s += len;
  return s;
}
function relToStart(s){
  if (!length) return 0;
  return ((s - startS) % length + length) % length;
}

function dist(a,b){
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.hypot(dx, dy);
}
function detectClosedPath(p){
  const a = p.getPointAtLength(0);
  const b = p.getPointAtLength(p.getTotalLength());
  const d = dist(a,b);
  return { closed: d < 4, d };
}

function angleDegAtS(s){
  const s1 = wrap(s, length);
  const s2 = wrap(s + 3, length);
  const p1 = path.getPointAtLength(s1);
  const p2 = path.getPointAtLength(s2);
  let a = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
  if (a < 0) a += 360;
  return a;
}
function angDiff(a,b){
  let d = (a - b) % 360;
  if (d < -180) d += 360;
  if (d > 180) d -= 360;
  return d;
}

function place(pl){
  if (!svg || !path || !length) return;

  const s = wrap(pl.s, length);
  const pLocal = path.getPointAtLength(s);

  // Tangente über zwei Punkte (für Normalenrichtung)
  const s2 = wrap(s + 2.5, length);
  const p2 = path.getPointAtLength(s2);

  let tx = (p2.x - pLocal.x), ty = (p2.y - pLocal.y);
  const tl = Math.hypot(tx, ty) || 1;
  tx /= tl; ty /= tl;

  // Normale (links vom Pfad)
  let nx = -ty, ny = tx;

  // Seitlicher Offset clampen (virtuelle Trackbreite)
  const maxOff = Math.max(0, TRACK_HALF_WIDTH - CAR_RADIUS);
  pl.off = Math.max(-maxOff, Math.min(maxOff, pl.off));

  // Offset auf den Local-Point anwenden
  const shifted = { x: pLocal.x + nx * pl.off, y: pLocal.y + ny * pl.off };

  const ctm = path.getScreenCTM();
  if (!ctm) return;

  const pt = svg.createSVGPoint();
  pt.x = shifted.x; pt.y = shifted.y;
  const p = pt.matrixTransform(ctm);

  pl.el.style.left = p.x + "px";
  pl.el.style.top  = p.y + "px";

  // Rotation (Auto schaut entlang Tangente)
  const ang = Math.atan2(ty, tx) * 180 / Math.PI;
  pl.el.style.transform = `translate(-50%,-50%) scale(0.82) rotate(${ang}deg)`;
}


/* Start/Ziel: tiefster Punkt */
function findLowestPointS(pathEl, len){
  let bestS=0, bestY=-Infinity;
  const step = Math.max(2, len/1800);
  for (let s=0; s<=len; s+=step){
    const p = pathEl.getPointAtLength(s);
    if (p.y > bestY){ bestY = p.y; bestS = s; }
  }
  // refine
  const a = Math.max(0, bestS-step), b = Math.min(len, bestS+step);
  for (let s=a; s<=b; s+=step/10){
    const p = pathEl.getPointAtLength(s);
    if (p.y > bestY){ bestY = p.y; bestS = s; }
  }
  return bestS;
}

/* =========================
   Main loop
   ========================= */
function ensureLoop(){
  if (raf) return;
  lastFrame = null;
  raf = requestAnimationFrame(tick);
}
ensureLoop();

function tick(t){
  raf = requestAnimationFrame(tick);

  // coords always
  mouseX = lerp(mouseX, mouseTx, MOUSE_SMOOTH);
  mouseY = lerp(mouseY, mouseTy, MOUSE_SMOOTH);
  updateCoords();

  // no race if no track
  if (!svg || !path || !length) { lastFrame = t; return; }

  // countdown
  if (raceState==="countdown"){
    const now = performance.now();
    const msLeft = Math.max(0, countdownEnd - now);
    const sec = Math.ceil(msLeft / 1000);
    const txt = (sec<=0) ? "GO" : String(sec);

    if (txt !== lastCountdownText){
      lastCountdownText = txt;
      raceCountdownEl.textContent = txt;
    }

    if (now >= countdownEnd){
      beginRace();
    }
    lastFrame = t;
    return;
  }

  if (raceState!=="running"){ lastFrame = t; return; }

  if (lastFrame==null){ lastFrame=t; return; }
  const dt = (t-lastFrame)/1000;
  lastFrame = t;

  // steering movement
  for (const id of ["p1","p2"]){
    const pl = players[id];
    if (pl.finished) continue;

    // ✅ robust: gasPressed existiert immer
    let speedFactor = 0;
    let gasPressed = false;

    if (id === "p1") {
      gasPressed = pl.keys.has("ArrowUp");
      const left  = pl.keys.has("ArrowLeft");
      const right = pl.keys.has("ArrowRight");

      if (left)  steerAngleP1 = (steerAngleP1 - STEER_SPEED * dt + 360) % 360;
      if (right) steerAngleP1 = (steerAngleP1 + STEER_SPEED * dt) % 360;

      // Seitlich beschleunigen
const steer = (left ? -1 : 0) + (right ? +1 : 0);
pl.offV += steer * OFF_ACCEL * dt;

// seitliche Dämpfung
pl.offV *= Math.exp(-OFF_DRAG * dt);

// Offset integrieren
pl.off += pl.offV * dt;


      const aTrack = angleDegAtS(pl.s);
      const diff = Math.abs(angDiff(steerAngleP1, aTrack));

      speedFactor = clamp01(1 - (diff / ALIGN_TOL));
      speedFactor = speedFactor * speedFactor;

    } else { // p2
      gasPressed = pl.keys.has("w");
      const left  = pl.keys.has("a");
      const right = pl.keys.has("d");

      if (left)  steerAngleP2 = (steerAngleP2 - STEER_SPEED * dt + 360) % 360;
      if (right) steerAngleP2 = (steerAngleP2 + STEER_SPEED * dt) % 360;

      const steer = (left ? -1 : 0) + (right ? +1 : 0);
pl.offV += steer * OFF_ACCEL * dt;
pl.offV *= Math.exp(-OFF_DRAG * dt);
pl.off += pl.offV * dt;


      const aTrack = angleDegAtS(pl.s);
      const diff = Math.abs(angDiff(steerAngleP2, aTrack));

      speedFactor = clamp01(1 - (diff / ALIGN_TOL));
      speedFactor = speedFactor * speedFactor;
    }

    const wantsMove = gasPressed && speedFactor > 0.05;

    // Start pro Player beim ersten echten Losfahren
    if (wantsMove && !pl.started){
      pl.started = true;
      pl.time = 0;
      pl.dist = 0;
      pl.lastRel = relToStart(pl.s);
      pl.v = 0;
    }

    if (pl.started && !pl.finished){
      pl.time += dt;
    }

    // ✅ Trägheit läuft auch beim Ausrollen weiter (wenn gestartet)
    if (pl.started && !pl.finished){
      const targetV = SPEED * speedFactor;

      if (gasPressed) {
        pl.v += (targetV - pl.v) * clamp01(ACCEL * dt / Math.max(1, SPEED));
      } else {
        pl.v *= Math.exp(-DRAG * dt);
      }

      if (speedFactor < 0.15) {
        pl.v *= Math.exp(-BRAKE * dt);
      }

      const ds = pl.v * dt;

      if (ds > 0.001) {
        pl.s = pathIsClosed ? wrap(pl.s + ds, length) : Math.min(pl.s + ds, length);
        pl.dist += ds;
        place(pl);

        const rel = relToStart(pl.s);
        const crossedStart = (rel < pl.lastRel);
        pl.lastRel = rel;

        if (!pl.finished && pl.dist >= length*0.90 && crossedStart){
          pl.finished = true;
          lastScore[id] = pl.time;
          if (id==="p1") scoreLkwEl.textContent = fmt(pl.time);
          if (id==="p2") scoreCarEl.textContent = fmt(pl.time);
          finishIfBoth();
        }
      }
    }
  }

  timerLkwEl.textContent = fmt(players.p1.time);
  timerCarEl.textContent = fmt(players.p2.time);
}

// ===== BlackBox Preview (letzter Track) =====
const blackPreviewEl = document.getElementById("blackPreview");

function setBlackPreview(id){

}

// Beim ersten Laden: A1 anzeigen
window.addEventListener("load", () => {

// ===== WEATHER SYSTEM (Layered: SKY + PRECIP) with soft crossfades (10-60s), runs only in IDLE =====
(() => {
  const canvas = document.getElementById("weatherCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");

  // ---------- Files ----------
  // Passe Endungen/Schreibweise an, falls deine Dateien anders heißen.
  const ASSETS = {
    rain:   ["images/regen/regen1.png", "images/regen/regen2.png", "images/regen/regen3.png"],
    snow:   ["images/schnee1.png", "images/schnee2.png"],
    sun:    ["images/sonne1.png"],

    // ✅ Hier kannst du beliebig viele Wolken hinzufügen:
    clouds: [
      "images/wolke1.png",
      "images/wolke2.png",
      "images/wolke3.png",
      "images/wolke4.png",
      "images/wolke5.png",
      // ...
    ],
  };

  function loadImages(list){
    return list.map(src => {
      const im = new Image();
      im.src = src;
      return im;
    });
  }

  const IMG = {
    rain:   loadImages(ASSETS.rain),
    snow:   loadImages(ASSETS.snow),
    sun:    loadImages(ASSETS.sun),
    clouds: loadImages(ASSETS.clouds),
  };

  // ---------- DPR resize ----------
  let W=1,H=1,dpr=1;
  function resize(){
    dpr = Math.max(1, window.devicePixelRatio || 1);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width  = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener("resize", resize, { passive:true });
  resize();

  // ---------- Utils ----------
  const TAU = Math.PI * 2;
  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function easeInOut(t){ return t*t*(3 - 2*t); } // smoothstep

  // ---------- WIND modifier state ----------
const WX = {
  wind: false,                 // ob Wind aktiv ist
  cloudSpeedMult: 1,           // Wolken Speed Multiplikator
  rainAngleRange: 22,          // max Winkel (Grad) ohne Wind
  rainAngleRangeWind: 34,      // max Winkel (Grad) mit Wind
  rainWindBase: 520,           // Basis “Wind”-Drift für Regen
  snowBlizzardChance: 0.35,    // normaler Blizzard Anteil
};

function setWind(on){
  WX.wind = !!on;
  WX.cloudSpeedMult = WX.wind ? 2.0 : 1.0; // ✅ Wolken 2× schneller bei Wind
}


  // ---------- Engine: RAIN (fein) ----------
  function makeRain(){
  const drops = [];
  const cfg = { count: 280, grav: 820, stretch: 1.08 };

  // ✅ GLOBALER Regen-Winkel (statt Random pro Tropfen)
  // 0° = gerade nach unten, negative Werte = nach links geneigt, positive = nach rechts.
  let angleDeg = 0;
  let windX = 0;         // px/s horizontal
  let angleHold = 0;     // Sekunden bis nächster Winkelwechsel

  function pickNewAngle(){
  // ✅ Range hängt von Wind ab
  const range = WX.wind ? WX.rainAngleRangeWind : WX.rainAngleRange;

  // angleDeg: + = clockwise (Canvas), - = counterclockwise
  angleDeg = rand(-range, range);

  // ✅ WICHTIG: Wenn PNGs im Uhrzeigersinn gedreht werden (angleDeg > 0),
  // sollen sie nach LINKS fallen => windX NEGATIV.
  // Bei angleDeg < 0 => nach RECHTS fallen => windX POSITIV.
  windX = -Math.tan(angleDeg * Math.PI/180) * WX.rainWindBase;

  // Bei Wind wechselt es etwas häufiger
  angleHold = WX.wind ? rand(3.5, 9.0) : rand(6, 16);
}


  function spawn(){
    const img = pick(IMG.rain);

    // fein/klein
    const scale = (img === IMG.rain[0]) ? rand(0.035,0.070)
                : (img === IMG.rain[1]) ? rand(0.045,0.090)
                :                        rand(0.055,0.110);

    drops.push({
      img,
      x: rand(-120, W+120),
      y: rand(-H, 0),
      vy: rand(520, 1150),
      scale
    });
  }

  function ensure(){
    while (drops.length < cfg.count) spawn();
    while (drops.length > cfg.count) drops.pop();
  }

  return {
    start(){
      drops.length = 0;
      pickNewAngle();
      ensure();
    },
    update(dt){
      ensure();

      // ✅ Winkel in “Steps” wechseln (nicht jittery)
      angleHold -= dt;
      if (angleHold <= 0) pickNewAngle();

      for (let i=drops.length-1; i>=0; i--){
        const d = drops[i];

        d.vy += cfg.grav * dt;

        // Bewegung: vertikal + globaler Wind (Winkel)
        d.x  += windX * dt;
        d.y  += d.vy * dt;

        // Respawn wenn raus
        if (d.y > H + 200 || d.x < -260 || d.x > W + 260){
          drops.splice(i,1);
          spawn();
        }
      }
    },
    draw(alpha){
      if (alpha <= 0.001) return;

      ctx.save();
      ctx.globalAlpha = alpha;

      // ✅ alle Tropfen im gleichen Winkel
      ctx.rotate(0); // nur zur Klarheit

      for (const d of drops){
        const im = d.img;
        if (!im.complete || !im.naturalWidth) continue;

        const w = im.naturalWidth  * d.scale;
        const h = im.naturalHeight * d.scale * cfg.stretch;

        ctx.save();
        ctx.translate(d.x, d.y);

        // globaler Winkel für alle
        ctx.rotate(angleDeg * Math.PI/180);

        ctx.drawImage(im, -w/2, -h/2, w, h);
        ctx.restore();
      }

      ctx.restore();
    }
  };
}


  // ---------- Engine: SNOW (flockig, mal ruhig mal wild) ----------
  function makeSnow(){
    const flakes = [];
    let cfg = null;

   function setRandomSnowMode(){
  // ✅ Wenn Wind aktiv: immer “dicht & wild”
  if (WX.wind){
    cfg = { count: 520, wind: rand(-190,-90), grav: rand(260,520), drift: 3.2, sway: 2.1 };
    return;
  }

  // normaler Mix (ruhig vs. blizzard)
  const blizzard = Math.random() < WX.snowBlizzardChance;
  cfg = blizzard
    ? { count: 380, wind: rand(-140,-60), grav: rand(220,420), drift: 2.6, sway: 1.8 }
    : { count: 190, wind: rand(-45, 15),  grav: rand(80, 170),  drift: 1.2, sway: 1.0 };
}


    function spawn(){
      const img = pick(IMG.snow);
      const scale = (img === IMG.snow[0]) ? rand(0.08,0.18) : rand(0.06,0.16);

      flakes.push({
        img,
        x: rand(-60, W+60),
        y: rand(-H, 0),
        vx: rand(cfg.wind-30, cfg.wind+30),
        vy: rand(cfg.grav*0.7, cfg.grav*1.4),
        scale,
        phase: rand(0, TAU),
        spin: rand(-0.35, 0.35),
        rot: rand(0, TAU),
      });
    }

    function ensure(){
      while (flakes.length < cfg.count) spawn();
      while (flakes.length > cfg.count) flakes.pop();
    }

    return {
      start(){
        setRandomSnowMode();
        flakes.length = 0;
        ensure();
      },
      update(dt, tSec){
        ensure();
        for (let i=flakes.length-1; i>=0; i--){
          const f = flakes[i];
          const sway = Math.sin(f.phase + tSec*cfg.sway) * (22 * cfg.drift);
          f.x += (f.vx * dt) + (sway * dt);
          f.y += f.vy * dt;
          f.rot += f.spin * dt;

          if (f.y > H + 120 || f.x < -220 || f.x > W + 220){
            flakes.splice(i,1);
            spawn();
          }
        }
      },
      draw(alpha){
        if (alpha <= 0.001) return;
        ctx.save();
        ctx.globalAlpha = alpha;

        for (const f of flakes){
          const im = f.img;
          if (!im.complete || !im.naturalWidth) continue;

          const w = im.naturalWidth  * f.scale;
          const h = im.naturalHeight * f.scale;

          ctx.save();
          ctx.translate(f.x, f.y);
          ctx.rotate(f.rot);
          ctx.drawImage(im, -w/2, -h/2, w, h);
          ctx.restore();
        }

        ctx.restore();
      }
    };
  }

  // ---------- Engine: CLOUDS (mal langsam, mal schnell) ----------
 function makeClouds(){
  const clouds = [];

  // Zustand für “Gust” (manchmal schnell)
  let gust = 1;
  let gustT = 0;

  // ✅ Spawn so, dass Wolken von links “rein gleiten”
  function spawnCloud(fast=false){
    const img = pick(IMG.clouds);
    const scale = rand(0.35, 1.00);

    const baseV = fast ? rand(90, 180) : rand(8, 24);

    clouds.push({
      img,
      scale,
      x: rand(-W*0.6, -120),
      y: rand(-H*0.06, H*0.55),
      vx: baseV,
      a: 0,
      targetA: rand(0.50, 0.92),
      life: 0,
      fadeInDur: rand(3.0, 6.5),     // ✅ sanfter rein
      // fadeOutDur: rand(3.0, 6.5),    // ✅ sanfter raus
      // outAt: rand(22, 60),           // später rausblenden

    });
  }

  function ensure(){
    const target = cloudsForceDense ? 14 : 7;
    while (clouds.length < target) spawnCloud(false);
    while (clouds.length > target) clouds.pop();
  }

  return {
    start(){
      clouds.length = 0;
      ensure();
      gust = 1;
      gustT = 0;
    },
    update(dt){
      ensure();

      // ✅ gelegentliche “Gusts”: alles schneller + extra schnelle Wolken
      if (gustT <= 0 && Math.random() < 0.01){
        gustT = rand(1.4, 3.2);
        gust = rand(2.2, 4.0);
        if (Math.random() < 0.7) spawnCloud(true);
        if (Math.random() < 0.35) spawnCloud(true);
      }
      if (gustT > 0){
        gustT -= dt;
        if (gustT <= 0){ gustT = 0; gust = 1; }
      }

      for (let i=clouds.length-1; i>=0; i--){
        const c = clouds[i];
        c.life += dt;
        c.x += c.vx * dt * gust * WX.cloudSpeedMult;


        // ✅ sanfter rein (ease)
const fin = clamp01(c.life / (c.fadeInDur || 4.5));
const fadeIn = easeInOut(fin);

// ✅ sanfter raus (ease)
const foutRaw = (c.life > c.outAt) ? clamp01((c.life - c.outAt) / (c.fadeOutDur || 4.5)) : 0;
const fadeOut = 1 - easeInOut(foutRaw);

// kleine “Atem”-Transparenz (dezent)
const breathe = 0.96 + Math.sin(c.life * 0.45) * 0.04;

c.a = c.targetA * fadeIn * fadeOut * breathe;


        // wenn komplett raus oder zu weit rechts -> ersetzen
        if (c.x > W + 420 || fadeOut <= 0.001){
          clouds.splice(i,1);
          spawnCloud(false);
        }
      }
    },
    draw(alpha){
      if (alpha <= 0.001) return;
      ctx.save();

      for (const c of clouds){
        const im = c.img;
        if (!im.complete || !im.naturalWidth) continue;

        const w = im.naturalWidth  * c.scale;
        const h = im.naturalHeight * c.scale;

        const darken = cloudsForceDense ? 1.35 : 1;
        ctx.globalAlpha = alpha * c.a * darken;
        ctx.drawImage(im, c.x, c.y, w, h);
      }

      ctx.restore();
    }
  };
}


  // ---------- Engine: SUN (statisch, aber fade-in beim Start) ----------
  function makeSun(){
    let a = 0;           // current alpha (0..1)
    let fadeSpeed = 0.35; // alpha pro Sekunde (langsames “entfalten”)

    return {
      start(){
        a = 0;
        fadeSpeed = rand(0.18, 0.38); // variiert leicht
      },
      update(dt){
        a = Math.min(1, a + fadeSpeed * dt);
      },
      draw(alpha){
        const im = IMG.sun[0];
        if (!im || !im.complete || !im.naturalWidth) return;

        const baseScale = Math.min(W, H) / 1200;
        const scale = baseScale * 0.9;

        const w = im.naturalWidth  * scale;
        const h = im.naturalHeight * scale;

        const x = W - w - 80;
        const y = 60;

        ctx.save();
        ctx.globalAlpha = alpha * a; // ✅ langsam auf volle Transparenz
        ctx.drawImage(im, x, y, w, h);
        ctx.restore();
      }
    };
  }

  const ENGINES = {
    rain: makeRain(),
    snow: makeSnow(),
    clouds: makeClouds(),
    sun: makeSun(),
  };

window.addEventListener("typewriterstart", () => {
  skyCloudsOn = true;

  // dicke Wolken für Lesbarkeit
  ENGINES.clouds.start();
  cloudsForceDense = true;

  gustBoost = 1.4;
  gustBoostT = 1.6;
});


  // ---------- LAYER CONTROLLER ----------
  // SKY: kann sun oder clouds sein, oder beides gleichzeitig (wir erlauben beides).
  // PRECIP: none / rain / snow (nur eins gleichzeitig).
/* =========================
   WEATHER SOUND ENGINE
   ========================= */
let weatherAudio = null;

function playWeather(src){
  stopWeather();
  weatherAudio = new Audio(src);
  weatherAudio.loop = true;
  weatherAudio.volume = 0.9;
  weatherAudio.play().catch(()=>{});
}

function stopWeather(){
  if (!weatherAudio) return;
  try{
    weatherAudio.pause();
    weatherAudio.currentTime = 0;
  }catch{}
  weatherAudio = null;
}

  /* =========================
   WEATHER AUDIO CONTROLLER
   ========================= */
function updateWeatherAudio(){
  // Wind übersteuert Regen
  if (WX.wind){
    playWeather("audio/wind1.wav");
    return;
  }

  // Regen nur wenn wirklich aktiv
  const rainActive = (precipCurr === "rain") || (precipNext === "rain");
  if (rainActive){
    playWeather("audio/regen1.wav");
    return;
  }

  // sonst kein Wetter-Sound
  stopWeather();
}

  let running = false;

  let tSec = 0;
  let lastMs = null;

  // kurzer Extra-Schub für Wolken (Cloud Burst)
let gustBoost = 1;
let gustBoostT = 0;
let cloudsForceDense = false;


  // layer states:
  // skyA: sun (optional)
  // skyB: clouds (optional)
  // precip: none/rain/snow (exklusiv)
  let skySunOn = false;
  let skyCloudsOn = false;

  let precipCurr = "none";
  let precipNext = null;

  // crossfade for precip only (rain<->snow<->none)
  let precipFading = false;
  let precipT = 1;      // 0..1
  let precipDur = 3.2;

  // schedule
  let nextSwitchAt = 0;
  function scheduleNext(){
    nextSwitchAt = tSec + rand(10, 60);
  }

  function pickPrecipNext(){
    // Gewichtet: öfter none/rain, seltener snow (du kannst das ändern)
    const r = Math.random();
    if (r < 0.45) return "none";
    if (r < 0.80) return "rain";
    return "snow";
  }

  function toggleSkyRandom(){
    // Clouds dürfen oft an sein. Sun seltener, aber möglich.
    // Clouds + Rain gleichzeitig ist hier automatisch möglich.
    const clouds = Math.random() < 0.75; // 75% clouds in idle
    const sun = Math.random() < 0.35;    // 35% sun zusätzlich

    const sunChanged = (sun !== skySunOn);
    const cloudsChanged = (clouds !== skyCloudsOn);

    skySunOn = sun;
    skyCloudsOn = clouds;

    if (sunChanged && skySunOn) ENGINES.sun.start();
    if (cloudsChanged && skyCloudsOn) ENGINES.clouds.start();
  }

function startSystem(){
  if (running) return;
  running = true;

  precipCurr = Math.random() < 0.5 ? "rain" : "snow";
  precipNext = precipCurr;
  precipT = 1;

  setWind(Math.random() < 0.25);
  toggleSkyRandom();

  spawnPrecip();
  spawnClouds();

  updateWeatherAudio();   // ← HIER eingefügt

  lastT = performance.now();
  raf = requestAnimationFrame(frame);
}


  function stopSystem(){
    running = false;
    skySunOn = false;
    skyCloudsOn = false;
    precipCurr = "none";
    precipNext = null;
    precipFading = false;
    precipT = 1;
    lastMs = null;
    ctx.clearRect(0,0,W,H);
  }

  function beginPrecipFadeTo(type){
    if (type === precipCurr) { scheduleNext(); return; }

    precipNext = type;
    precipFading = true;
    precipT = 0;
    precipDur = rand(2.6, 4.2);

    if (precipNext !== "none") ENGINES[precipNext].start();
  }

  function commitPrecip(){
    precipCurr = precipNext;
    precipNext = null;
    precipFading = false;
    precipT = 1;
    scheduleNext();
  }

  function frame(ms){
    requestAnimationFrame(frame);
    if (!running) return;

    if (lastMs == null) lastMs = ms;
    const dt = Math.min(0.033, (ms - lastMs)/1000);
    lastMs = ms;
    tSec += dt;

    // schedule switch
    if (tSec >= nextSwitchAt){
      // jedes Mal: sky kann sich ändern UND precip kann wechseln
      // WIND: zufällig aktiv (z.B. 25%)
setWind(Math.random() < 0.25);

toggleSkyRandom();
beginPrecipFadeTo(pickPrecipNext());
updateWeatherAudio();


    }

    // update engines
    if (skySunOn) ENGINES.sun.update?.(dt, tSec);
    if (gustBoostT > 0){
  gustBoostT -= dt;
  if (gustBoostT <= 0){ gustBoostT = 0; gustBoost = 1; }
}
if (skyCloudsOn) ENGINES.clouds.update?.(dt * gustBoost, tSec);


    if (precipCurr !== "none") ENGINES[precipCurr].update?.(dt, tSec);
    if (precipNext && precipNext !== "none") ENGINES[precipNext].update?.(dt, tSec);

    // draw
    ctx.clearRect(0,0,W,H);

   // SKY first
// ✅ Sonne dimmen, wenn Wolken aktiv sind
const sunAlpha = skyCloudsOn ? 0.38 : 1.0;

if (skySunOn) ENGINES.sun.draw?.(sunAlpha);
if (skyCloudsOn) ENGINES.clouds.draw?.(1);


    // PRECIP on top with fade
    if (precipFading){
      precipT = Math.min(1, precipT + dt / Math.max(0.001, precipDur));
      const e = easeInOut(precipT);

      const aNext = e;
      const aCurr = 1 - e;

      if (precipCurr !== "none") ENGINES[precipCurr].draw?.(aCurr);
      if (precipNext !== "none") ENGINES[precipNext].draw?.(aNext);

      if (precipT >= 1) commitPrecip();
    } else {
      if (precipCurr !== "none") ENGINES[precipCurr].draw?.(1);
    }
  }

  requestAnimationFrame(frame);

    // ----- Hooks: only active in idle -----
  window.addEventListener("idleenter", () => {
    // ✅ SOFORT alles bisherige Audio aus
    stopAllVehicleSounds();
    stopWeather();
    masterAmbient.stop(); // ✅ 172.wav stoppt im Ruhemodus

    if (running) return;
    startSystem();
    updateWeatherAudio(); // ✅ startet regen1/wind1 passend
  });

  window.addEventListener("idleleave", () => {
    // ✅ Wetter aus + Wetter-Sound aus
    stopSystem();
    stopWeather();

    // ✅ 172.wav wieder starten (wenn schon "unlocked" durch ersten click)
    masterAmbient.tryPlay();
  });


})();
