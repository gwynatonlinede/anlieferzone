<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>anlieferzone</title>

<style>
  @font-face{
    font-family:"g1";
    src:url("fonts/g1.ttf") format("truetype");
    font-weight:100 900;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --green:#00ff00;
    --ui-z:2147483647;
  }

  body{ margin:0; background:var(--green); transition:background 1200ms ease; }
  html, body {
  font-family: "g1", sans-serif;
}

  /* ===== GRID ===== */
  .grid{
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    position:relative;
    z-index:1;
    transition: transform 1.6s ease, filter 1.6s ease, opacity 1.6s ease;
    will-change: transform;
    /* ✅ verhindert grüne Haarlinien zwischen Bildern */
  background:#8b8b8b;
  gap:0;
    
  }
  .cell{
  position:relative;
  z-index:0;
  overflow:visible;   /* wichtig: Hover darf nicht abgeschnitten werden */
}
  .cell.isHoverTop{ z-index:100000; }
  .cell img{ width:100%; height:auto; display:block; }

  

  /* ===== HOVER ===== */
  #hoverLayer{
  position:fixed;
  inset:0;
  z-index:2147483647; /* ganz oben */
  pointer-events:auto;
  display:none;
}

#hoverLayerImg{
  position:absolute;
  width:150px;        /* wie dein Hover bisher */
  height:auto;
  display:block;
  pointer-events:auto; /* damit klicken geht */
}

  /* ===== TRACK OVERLAY ===== */
  #trackOverlay{
    position:fixed;
    inset:0;
    display:none;
    z-index:2600;
    background:rgba(0,0,0,0);
  }

  #trackBg{
    position:absolute;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:contain;
    z-index:0;
    pointer-events:none;
    display:block;
  }

  #trackOverlay svg{
    position:absolute;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
    z-index:1;
  }

  #trackOverlay svg,
  #trackBg{
    transform-origin:center center;
  }

  /* ===== HUD ===== */
 #raceHud{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:var(--ui-z);
  font-family:"g1", sans-serif;
  color:var(--green);
  text-shadow:0 6px 18px rgba(0,0,0,0.35);
  user-select:none;
  pointer-events:none;
  text-transform:uppercase;
  letter-spacing:0.02em;
  display:none;
  text-align:center;

  /* ✅ Platz reservieren, damit Timer/Score niemals springen */
  padding-top:210px;
  box-sizing:border-box;
}

#raceCountdown{
  /* ✅ absolute Overlay → drückt nichts mehr */
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  font-size:96px;
  line-height:normal;
  margin:0;
  display:none;
}

  /* ===== PLAYERS ===== */
  .player{
    position:fixed;
    z-index:2147483646;
    display:none;
    pointer-events:none;
    user-select:none;
    transform:translate(-50%,-50%) scale(0.82);
    transform-origin:center center;
  }
  #lkw{ width:90px; }
  #car{ width:70px; }

  /* ===== COORDS ===== */
  #coords{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:var(--ui-z);
    color:#000;
    font-family:"g1", sans-serif;
    font-size:22px;
    line-height:1.1;
    user-select:none;
    pointer-events:none;
    white-space:pre;
  }

  /* ===== BOTTOM AREA ===== */
  #bottomArea{
    position:relative;
    width:100%;
    min-height:320px;
    background:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px 70px;

  }
  #bottomButtons{
    display:flex;
    flex-direction:column;

  }
  .bigBtn{

  #blackBox{

  /* ===== PANEL ===== */

  #panel{

  /* ===== TRACKS GRID ===== */

  #arteClose{
    position:absolute;

  /* ===== WEATHER CANVAS ===== */

    inset:0;

  /* ===== TYPEWRITER ===== */
  /* Typewriter: echte volle Breite bis zum rechten Rand (innerhalb des Overlays) */
#typeText,
#typeGrid,
.typeCol,
.colContent{
  width:100%;
}

  #typeOverlay{
    position:fixed;
    inset:0;

.typeLine{
  display:block;            /* ✅ echte Zeilen untereinander */

}

  /* Idle soll NICHT den Hintergrund ändern */
  body.idle{ }

  body.reading{
    background:#8f8f8f;
  }

  /* ===== RACE: AMPEL + FINISH ===== */
  #trafficLight{

<body>

<script>
/* =========================
   TUNING
   ========================= */
const TUNE = {
  driftRange: 2000,
  driftRotate: 2.2,
  driftDuration: 40200,
  driftReset: 2000,

  // Click stack loudness
  clickMaxVoices: 8,
  clickBaseVol: 0.55,
  clickGainStep: 0.35,
  clickGainMax: 4.0,
};

/* =========================
   Helpers
   ========================= */
function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }

/* =========================
   GRID DRIFT (pro Kachel, wie früher)
   ========================= */
(() => {
  const gridEl = document.getElementById("grid");
  if (!gridEl) return;

  function applyDrift(){
    const cells = Array.from(gridEl.querySelectorAll(".cell"));
    for (const cell of cells){
      const x = rand(-TUNE.driftRange, TUNE.driftRange);
      const y = rand(-TUNE.driftRange, TUNE.driftRange);
      const r = rand(-TUNE.driftRotate, TUNE.driftRotate);

      cell.style.transition = `transform ${TUNE.driftDuration}ms ease`;
      cell.style.transform  = `translate(${x}px, ${y}px) rotate(${r}deg)`;
    }
  }

  function resetDrift(){
    const cells = Array.from(gridEl.querySelectorAll(".cell"));
    for (const cell of cells){
      cell.style.transition = `transform ${TUNE.driftReset}ms ease`;
      cell.style.transform  = `translate(0px, 0px) rotate(0deg)`;
    }
  }

  window.addEventListener("typewriterstart", applyDrift);
  window.addEventListener("typewriterstop", resetDrift);
  window.addEventListener("idleleave", resetDrift);
})();

/* =========================
   MASTER AMBIENT 172.wav
   ========================= */
const masterAmbient = (() => {
  let unlocked = false;
  const a = new Audio("audio/172.wav");
  a.loop = true;
  a.preload = "auto";
  a.volume = 1.0;

  async function tryPlay(){
    if (!unlocked) return;
    try { await a.play(); } catch {}
  }
  function unlockAndPlay(){
    if (!unlocked) unlocked = true;
    tryPlay();
  }
  function stop(){
    try { a.pause(); a.currentTime = 0; } catch {}
  }
  window.addEventListener("pointerdown", unlockAndPlay, { passive:true });
  return { tryPlay, stop };
})();

/* =========================
   AUDIO MANAGER
   ========================= */
const VEHICLE_SOUNDS = [
  "audio/motor1.wav",
  "audio/motorrad1.wav",
  "audio/lkw1.wav",
  "audio/lkw2.wav",
  "audio/lkw3.wav",
  "audio/lkw4.wav",
  "audio/lkw5.wav",
  "audio/lkw6.wav",
  "audio/fridge1.wav",
  "audio/crow1.wav",
  "audio/wash1.wav",
  "audio/wash3.wav",
  "audio/wash4.wav",
  "audio/circles.wav",
  "audio/klang1.wav",
];

let vehicleStack = [];
let weatherAudio = null;

function playLoop(src, volume=1.0){
  const a = new Audio(src);
  a.loop = true;
  a.preload = "auto";
  a.volume = volume;
  a.play().catch(()=>{});
  return a;
}
function playRandomVehicleSound(){
  const src = pick(VEHICLE_SOUNDS);
  const a = playLoop(src, 0.55);
  vehicleStack.push(a);
}
function stopAllVehicleSounds(){
  for (const a of vehicleStack){
    try { a.pause(); a.currentTime = 0; } catch {}
  }
  vehicleStack.length = 0;
}
function playWeather(src){
  stopWeather();
  if (!src) return;
  weatherAudio = playLoop(src, 0.8);
}
function stopWeather(){
  if (!weatherAudio) return;
  try { weatherAudio.pause(); weatherAudio.currentTime = 0; } catch {}
  weatherAudio = null;
}

/* =========================
   CLICK STACK
   ========================= */
const CLICK_SOUNDS = [];
let clickStack = [];
let clickGainMult = 1.0;

function applyClickGain(){
  for (const v of clickStack){
    v.a.volume = Math.min(1.0, v.base * clickGainMult);
  }
}
function cleanupClickStack(){
  clickStack = clickStack.filter(v => !v.a.ended);
}
function playClickSoundOneShot(src){
  const a = new Audio(src);
  a.preload = "auto";
  a.loop = false;
  a.volume = Math.min(1.0, TUNE.clickBaseVol * clickGainMult);
  a.play().catch(()=>{});

  a.addEventListener("ended", () => {
    clickStack = clickStack.filter(v => v.a !== a);
  });

  clickStack.push({ a, base: TUNE.clickBaseVol });
}
function onAnyClickStackSound(){
  if (!CLICK_SOUNDS.length) return;
  cleanupClickStack();
  if (clickStack.length < TUNE.clickMaxVoices){
    playClickSoundOneShot(pick(CLICK_SOUNDS));
    return;
  }
  clickGainMult = Math.min(TUNE.clickGainMax, clickGainMult + TUNE.clickGainStep);
  applyClickGain();
}
function stopAllClickSounds(){
  for (const v of clickStack){
    try { v.a.pause(); v.a.currentTime = 0; } catch {}
  }
  clickStack.length = 0;
  clickGainMult = 1.0;
}
window.addEventListener("pointerdown", () => { onAnyClickStackSound(); }, { passive:true });

/* =========================
   IDLE MODE (5s ohne Input) + Events
   ========================= */
(() => {
  const IDLE_MS = 5000;
  let idleTimer = null;
  let isIdle = false;

  function setIdle(on){
    if (isIdle === on) return;
    isIdle = on;
    document.body.classList.toggle("idle", on);
    window.dispatchEvent(new CustomEvent("idlechange", { detail:{ idle:on } }));
    if (on) window.dispatchEvent(new Event("idleenter"));
    else window.dispatchEvent(new Event("idleleave"));
  }

  function bump(){
    setIdle(false);
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => setIdle(true), IDLE_MS);
  }

  ["pointerdown","pointermove","mousemove","keydown","wheel","touchstart"].forEach(ev=>{
    window.addEventListener(ev, bump, { passive:true });
  });

  bump();
})();

/* =========================
   TYPEWRITER
   - 5 Texte random, nie zweimal hintereinander gleich
   - Zeilen-Variationen, aber immer so skaliert, dass ALLES in den Viewport passt
   ========================= */
(() => {
  const overlay = document.getElementById("typeOverlay");
  const col0 = document.getElementById("col0");
  if (!overlay || !col0) return;

  const IDLE_DELAY_MS = 20000;

  const TYPE_MIN = 14;
  const TYPE_MAX = 55;

  const LINE_MIN = 14;
  const LINE_MAX = 160;

  const TEXT_FILES = [
    "text/anlieferzone1.txt",
    "text/anlieferzone2.txt",
    "text/anlieferzone3.txt",
    "text/anlieferzone4.txt",
    "text/anlieferzone5.txt",
  ];
  let lastTextIndex = -1;

  let fullText = "";
  let i = 0;
  let timer = null;
  let idleDelayTimer = null;

  let plannedLines = [];
  let lineIndex = 0;
  let currentLineEl = null;
  let currentLineText = "";

  function charDelay(ch){
    if (ch === ".") return rand(260,520);
    if (ch === ",") return rand(140,260);
    if (ch === "\n") return rand(280,620);
    if (ch === " ") return rand(20,45);
    return rand(TYPE_MIN, TYPE_MAX);
  }

function normalizeTypingText(txt){
  txt = String(txt || "");

  txt = txt.replace(/[\u00A0\u202F]/g, " ");
  txt = txt.replace(/[\u200B-\u200D\uFEFF]/g, "");
  txt = txt.replace(/\r\n?/g, "\n");

  // Mehrfach-Leerzeilen begrenzen
  txt = txt.replace(/\n{3,}/g, "\n\n");

  // Zeilen trimmen, aber Struktur behalten
  txt = txt.split("\n").map(l => l.replace(/[ \t]{2,}/g, " ").trim()).join("\n");

  return txt.trim();
}

  function pickNextTextFile(){
    if (!TEXT_FILES.length) return null;
    let idx = (Math.random() * TEXT_FILES.length) | 0;
    if (TEXT_FILES.length > 1){
      while (idx === lastTextIndex) idx = (Math.random() * TEXT_FILES.length) | 0;
    }
    lastTextIndex = idx;
    return TEXT_FILES[idx];
  }

  async function loadText(){
    const file = pickNextTextFile();
    if (!file) throw new Error("Keine TEXT_FILES definiert.");
    const res = await fetch(file, { cache:"no-store" });
    if (!res.ok) throw new Error("Text nicht gefunden: " + file);
    return normalizeTypingText(await res.text());
  }

function showHidden(){
  overlay.style.display = "block";
  overlay.style.visibility = "hidden";
  overlay.style.opacity = "0";
}
function showVisible(){
  overlay.style.display = "block";
  overlay.style.visibility = "visible";
  overlay.style.opacity = "1";
}
function hide(){
  overlay.style.display = "none";

  function ensureMeasureNode(){
  let meas = document.getElementById("typeMeasure");
  if (meas) return meas;

  meas = document.createElement("div");
  meas.id = "typeMeasure";
  meas.style.position = "fixed";
  meas.style.left = "-99999px";
  meas.style.top = "0";
  meas.style.padding = "0";
  meas.style.margin = "0";
  meas.style.boxSizing = "border-box";
  meas.style.visibility = "hidden";
  meas.style.pointerEvents = "none";

  // ✅ MUSS exakt wie #typeText sein
  meas.style.fontFamily = "g1, sans-serif";
  meas.style.fontWeight = "800";
  meas.style.letterSpacing = "0.01em";
  meas.style.lineHeight = "1.05";

  // ✅ wir messen Zeilenbreite ohne Umbruch
  meas.style.whiteSpace = "nowrap";
  meas.style.wordBreak = "keep-all";
  meas.style.overflowWrap = "normal";
  meas.style.hyphens = "none";

  document.body.appendChild(meas);
  return meas;
}


  function measurePlannedHeight(lines){
    const meas = ensureMeasureNode();
    meas.innerHTML = "";
    for (const ln of lines){
      const d = document.createElement("div");
      d.className = "typeLine";
      d.style.fontSize = ln.sizePx + "px";
      d.textContent = ln.text || "";
      meas.appendChild(d);
    }
    return meas.scrollHeight;
  }

function planLineSizesToFit(text){
  function targetWidthPx(){
    const w = col0?.clientWidth || col0?.getBoundingClientRect?.().width || 0;
    return Math.max(240, Math.floor(w || (window.innerWidth - 48)));
  }

  // TXT -> Absätze: jede nicht-leere Zeile wird Fließtext, Leerzeile trennt Absätze
  function parseParagraphs(raw){
    const lines = String(raw || "").split("\n");
    const paras = [];
    let buf = [];
    for (const ln of lines){
      const t = ln.trim();
      if (!t){
        if (buf.length){
          paras.push(buf.join(" ").replace(/[ \t]{2,}/g, " ").trim());
          buf = [];
        }
        continue;
      }
      buf.push(t);
    }
    if (buf.length) paras.push(buf.join(" ").replace(/[ \t]{2,}/g, " ").trim());
    return paras.filter(Boolean);
  }

  // ✅ Exaktes Fill-to-width per DOM-Messung (unsichtbar), NUR über Schriftgröße
  function fitSizeExactDOM(str, seedSize, width){
    const text = String(str || "").trim();
    if (!text) return seedSize;

    const FILL = 1.01;       // kleiner Overfill gegen Rundung
    const MIN_S = 4;     // kleiner möglich
    const MAX_S = 420;   // größer möglich

    const tester = document.createElement("div");
    tester.className = "typeLine";
    tester.style.visibility = "hidden";
    tester.style.pointerEvents = "none";
    tester.style.position = "absolute";
    tester.style.left = "0";
    tester.style.top = "0";
    tester.style.whiteSpace = "nowrap";
    tester.style.display = "inline-block";
    tester.style.width = "auto";
    tester.textContent = text;
    col0.appendChild(tester);

    const measureAt = (px) => {
  tester.style.fontSize = px + "px";
  // ✅ echte Textbreite (nowrap)
  return Math.max(1, tester.scrollWidth || 1);
};

    // Startschätzung
    const w0 = measureAt(seedSize);
    let s = seedSize * (width / w0) * FILL;
    s = Math.max(MIN_S, Math.min(MAX_S, s));

    // Binary search Bereich
    let lo = Math.max(MIN_S, s * 0.55);
    let hi = Math.min(MAX_S, s * 1.55);

    // Bereich einschließen
    for (let k=0; k<10; k++){
      const wLo = measureAt(lo);
      const wHi = measureAt(hi);
      if (wLo <= width && wHi >= width) break;
      lo = Math.max(MIN_S, lo * 0.82);
      hi = Math.min(MAX_S, hi * 1.22);
    }

    for (let it=0; it<18; it++){
      const mid = (lo + hi) / 2;
      const wm = measureAt(mid);
      if (wm < width) lo = mid;
      else hi = mid;
    }

    col0.removeChild(tester);
    return Math.max(MIN_S, Math.min(MAX_S, hi));
  }

function pickFillTarget(){
  const r = Math.random();

  // 92%: ultra-ultra lang => sehr klein
  if (r < 0.92) return rand(0.997, 0.99985);

  // 6%: mittel
  if (r < 0.98) return rand(0.78, 0.90);

  // 2%: ultra kurz => sehr groß
  return rand(0.22, 0.40);
}

  function breakIntoLinesWithVariation(paragraph, width){
  const meas = ensureMeasureNode();
  meas.style.whiteSpace = "nowrap";

  //ZEILEN//
  // ✅ kleiner = beim Planen passen mehr Wörter in eine Zeile
  // (wichtig für "viele kleine Zeilen")
  const REF_SIZE = 16;

  function measure(str){
    meas.style.fontSize = REF_SIZE + "px";
    meas.textContent = str || "";
    return Math.max(1, meas.scrollWidth || meas.getBoundingClientRect().width || 1);
  }

  const GROUP_MAX = 5;

function pickMode(prev){
  const r = Math.random();
  let m = (r < 0.99) ? "TINY" : "HUGE";   // 90% tiny → durchschnittlich kleiner
  if (m === prev) m = (m === "TINY") ? "HUGE" : "TINY";
  return m;
}

function pickFillTargetForMode(mode){
  if (mode === "TINY") return rand(0.9, 0.98); // länger → kleiner
  return rand(0.18, 0.25);                       // huge bleibt riesig, aber seltener
}

  const words = paragraph.split(/\s+/).filter(Boolean);
  const out = [];

  let cur = "";
  let prevMode = null;
  let mode = pickMode(prevMode);
  let remainingInGroup = GROUP_MAX;
  let fillTarget = pickFillTargetForMode(mode);

  function startNewGroup(){
    prevMode = mode;
    mode = pickMode(prevMode);
    remainingInGroup = GROUP_MAX;
    fillTarget = pickFillTargetForMode(mode);
  }

  for (const w of words){
    const next = cur ? (cur + " " + w) : w;
    const tw = measure(next);

    const target = width * fillTarget;

    // ✅ harte Kante: nie über width
    if (cur && tw > width){
      out.push(cur);
      remainingInGroup--;

      if (remainingInGroup <= 0) startNewGroup();
      // neuer Zeilenlauf innerhalb aktueller Gruppe
      fillTarget = pickFillTargetForMode(mode);

      cur = w;
      continue;
    }

    // ✅ gruppenbasiertes Brechen:
    // - HUGE bricht sehr früh (kurze Zeilen)
    // - TINY bricht sehr spät (lange Zeilen)
    if (cur && tw >= target){
      out.push(cur);
      remainingInGroup--;

      if (remainingInGroup <= 0) startNewGroup();
      fillTarget = pickFillTargetForMode(mode);

      cur = w;
      continue;
    }

    cur = next;
  }

  if (cur) out.push(cur);

  return out;
}

  const width = targetWidthPx();
  const paras = parseParagraphs(String(text || ""));

  function seedForLine(){
  const r = Math.random();

  if (r < 0.85) return rand(8, 20);     // öfter klein
  return rand(50, 110);                 // große Seeds deutlich reduziert
}

let planned = [];

// "mittelgroß" definieren (hier kannst du später feinjustieren)
const MID_MIN = 18;
const MID_MAX = 160;
let midRun = 0;

for (let pi=0; pi<paras.length; pi++){
  const lines = breakIntoLinesWithVariation(paras[pi], width);

  let lineGroup = 0;
  let groupSeed = seedForLine();

  for (const ln of lines){

    // spätestens alle 5 Zeilen neue "Größenphase"
    if (lineGroup >= 5){
      groupSeed = seedForLine();
      lineGroup = 0;
    }

    // ---- Begrenzung: max. 5 mittelgroße Zeilen nacheinander ----
    // Wenn wir schon 5 "MIDs" hatten, zwingen wir ein Extrem:
    // - 90%: TINY (klein) → hilft dir zusätzlich "mehr Text auf weniger Fläche"
    // - 10%: HUGE (sehr groß) → bleibt als gelegentlicher Ausreißer erhalten
    let localSeed = groupSeed;
    if (midRun >= 5){
      localSeed = (Math.random() < 0.90) ? rand(7, 14) : rand(140, 220);
    }

    const sizePx = fitSizeExactDOM(ln, localSeed, width);
    planned.push({ text: ln, sizePx });

    const isMid = (sizePx >= MID_MIN && sizePx <= MID_MAX);
    midRun = isMid ? (midRun + 1) : 0;

    lineGroup++;
  }

  if (pi < paras.length - 1){
    planned.push({ text:"", sizePx: 18 });
    midRun = 0; // Absatz trennt: Mid-Run resetten
  }
}


// =========================
// FINAL HEIGHT-FIT  (maximaler sichtbarer Text)
// =========================

const maxH = window.innerHeight - 48;

let h = measurePlannedHeight(planned);
let guard = 0;

while (h > maxH && guard < 80){

  // kleinste Schrift finden
  let smallest = Infinity;
  for (const ln of planned){
    if (!ln.text) continue;
    if (ln.sizePx < smallest) smallest = ln.sizePx;
  }

  const threshold = smallest * 1.45;

  planned = planned.map(ln => {
    if (!ln.text) return ln;

    const fs = ln.sizePx;

    // große Zeilen schützen
    if (fs > 160) return ln;

    // kleine Zeilen stärker schrumpfen
    if (fs <= threshold){
      return { ...ln, sizePx: Math.max(1.2, fs * 0.85) };
    }

    return { ...ln, sizePx: Math.max(1.6, fs * 0.96) };
  });

  // wieder exakt auf Breite fitten
  planned = planned.map(ln => {
    if (!ln.text) return ln;
    return { ...ln, sizePx: fitSizeExactDOM(ln.text, ln.sizePx, width) };
  });

  h = measurePlannedHeight(planned);
  guard++;
}
return planned
}


async function startTyping(){
  if (!fullText) return;

  // ✅ Overlay layouten aber UNSICHTBAR
  showHidden();

  // ✅ auf Webfont warten
  try{ if (document.fonts?.ready) await document.fonts.ready; }catch{}

  // ✅ 2 Frames warten: Breiten stimmen dann wirklich
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  // ✅ JETZT planen (endgültige Größen!)
  plannedLines = planLineSizesToFit(fullText);

  lineIndex = 0;
  i = 0;
  col0.innerHTML = "";
  currentLineEl = null;
  currentLineText = "";

  // ✅ erst jetzt sichtbar machen (keine sichtbare Anpassung)
  showVisible();

  document.body.classList.add("reading");
  window.dispatchEvent(new Event("typewriterstart"));

  function createLineForIndex(idx){
    const ln = plannedLines[idx] || { text:"", sizePx: LINE_MIN };
    currentLineEl = document.createElement("div");
    currentLineEl.className = "typeLine";
    currentLineEl.style.fontSize = ln.sizePx + "px";
    // ✅ größere Schrift = kleinerer Zeilenabstand
const fs = ln.sizePx || 20;

// 1.02 bei klein, runter bis 0.78 bei sehr groß
const lh = Math.max(0.78, Math.min(1.02, 1.06 - (fs / 260)));

currentLineEl.style.lineHeight = lh.toFixed(3);
    currentLineEl.style.transform = "none";
    col0.appendChild(currentLineEl);
    currentLineText = "";
    i = 0;
  }

  createLineForIndex(0);

  const step = () => {
    const ln = plannedLines[lineIndex] || { text:"" };
    const lineStr = String(ln.text ?? "");

    if (lineStr.length === 0){
      currentLineEl.textContent = "";
      lineIndex++;
      if (lineIndex >= plannedLines.length){ clearTimeout(timer); timer=null; return; }
      createLineForIndex(lineIndex);
      timer = setTimeout(step, rand(120, 220));
      return;
    }

    const ch = lineStr[i++];
    if (ch != null){
      currentLineText += ch;
      currentLineEl.textContent = currentLineText;
    }

    if (i >= lineStr.length){
      lineIndex++;
      if (lineIndex >= plannedLines.length){ clearTimeout(timer); timer=null; return; }
      createLineForIndex(lineIndex);
      timer = setTimeout(step, rand(140, 260));
      return;
    }

    timer = setTimeout(step, charDelay(ch));
  };

  clearTimeout(timer);
  timer = setTimeout(step, rand(120, 240));
}


  function stopTyping(){
    if (idleDelayTimer){ clearTimeout(idleDelayTimer); idleDelayTimer = null; }
    if (timer){ clearTimeout(timer); timer = null; }

    document.body.classList.remove("reading");
    window.dispatchEvent(new Event("typewriterstop"));
    col0.innerHTML = "";
    hide();
  }

  function scheduleStartAfterIdle(){
    if (idleDelayTimer) clearTimeout(idleDelayTimer);
    idleDelayTimer = setTimeout(async () => {
      try{
        fullText = await loadText();
        startTyping();
      }catch(err){
        console.warn(err);
      }
    }, IDLE_DELAY_MS);
  }

  window.addEventListener("idleenter", scheduleStartAfterIdle);
  window.addEventListener("idleleave", stopTyping);

  window.addEventListener("resize", () => {
    if (overlay.style.display === "block" && fullText){
      startTyping();
    }
  }, { passive:true });
})();

   ========================= */
const letters = "ABCDEFGHIJ".split("");
const N = 100;
const grid = document.getElementById("grid");

function idFromIndex(i){
  const r = Math.floor(i / 10) + 1;
  const c = i % 10;
  return letters[c] + r;
}
function indexFromId(id){
  const c = letters.indexOf(id[0]);
  const r = parseInt(id.slice(1), 10);
  if (c < 0 || !(r >= 1 && r <= 10)) return 0;
  return (r - 1) * 10 + c;
}

function clamp01(v){ return Math.max(0, Math.min(1, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function bilerp(tl,tr,bl,br,x,y){
  const top = lerp(tl, tr, x);
  const bot = lerp(bl, br, x);
  return lerp(top, bot, y);
}
function updateCoords(){
  const lat = bilerp(TL.lat, TR.lat, BL.lat, BR.lat, mouseX, mouseY);
  const lon = bilerp(TL.lon, TR.lon, BL.lon, BR.lon, mouseX, mouseY);
  coordsEl.textContent = lat.toFixed(COORD_DECIMALS) + "," + lon.toFixed(COORD_DECIMALS);
}
window.addEventListener("mousemove", (e) => {
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  mouseTx = clamp01(e.clientX / w);
  mouseTy = clamp01(e.clientY / h);
});

const activeHovers = new Map();

function showHover(cell, id){

  let img = activeHovers.get(id);
  const r = cell.getBoundingClientRect();

  if (!img){
    img = document.createElement("img");
    img.src = `images/${id}_hover.png`;

    img.style.position = "fixed";
    img.style.zIndex = "9999";
    img.style.pointerEvents = "none";
    img.style.width = "150px";
    img.style.height = "auto";
    img.style.display = "block";
    img.style.opacity = "0";

    document.body.appendChild(img);
    activeHovers.set(id, img);
  }

  img.style.left = r.left + "px";
  img.style.top  = r.top  + "px";
  img.style.opacity = "1";

  if (img._hideTimer){
    clearTimeout(img._hideTimer);
    img._hideTimer = null;
  }
}

function hideHover(cell, id){

  // Gefahrene Tracks bleiben sichtbar
  if (drivenTracks.has(id)) return;

  const img = activeHovers.get(id);
  if (!img) return;

  // bestehenden Timer abbrechen
  if (img._hideTimer){
    clearTimeout(img._hideTimer);
  }

  img._hideTimer = setTimeout(() => {
    img.style.opacity = "0";
  }, 260);   // ← HIER Delay einstellen (ms)
}

/* ===== SCORE STORAGE (per Track) ===== */
const SCORE_KEY = "anlieferzone_scores_v1";

function loadScoreDB(){
  try{
    const raw = localStorage.getItem(SCORE_KEY);
    const db = raw ? JSON.parse(raw) : {};
    return (db && typeof db === "object") ? db : {};
  }catch{
    return {};
  }
}
function saveScoreDB(db){
  try{ localStorage.setItem(SCORE_KEY, JSON.stringify(db)); }catch{}

}
function recordScore(trackId, tLkw, tCar){
  if (!trackId) return;
  if (typeof tLkw !== "number" || typeof tCar !== "number") return;

  const db = loadScoreDB();
  if (!db[trackId]) db[trackId] = [];
  db[trackId].push({ ts: Date.now(), lkw: tLkw, car: tCar });
  if (db[trackId].length > 40) db[trackId] = db[trackId].slice(-40);
  saveScoreDB(db);
}
function bestTime(entries, key){
  let best = null;
  for (const e of entries){
    const v = e?.[key];
    if (typeof v !== "number") continue;
    if (best == null || v < best) best = v;
  }
  return best;
}

function escapeHtml(s){
  return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function wrap(s,len){
  if (len<=0) return 0;
  s = s % len;
  if (s<0) s += len;
  return s;
}
function relToStart(s){
  if (!length) return 0;
  return ((s - startS) % length + length) % length;
}
function dist(a,b){
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.hypot(dx, dy);
}
function detectClosedPath(p){
  const a = p.getPointAtLength(0);
  const b = p.getPointAtLength(p.getTotalLength());
  const d = dist(a,b);
  return { closed: d < 4, d };
}
function angleDegAtS(s){
  const s1 = wrap(s, length);
  const s2 = wrap(s + 3, length);
  const p1 = path.getPointAtLength(s1);
  const p2 = path.getPointAtLength(s2);
  let a = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
  if (a < 0) a += 360;
  return a;
}
function angDiff(a,b){
  let d = (a - b) % 360;
  if (d < -180) d += 360;
  if (d > 180) d -= 360;
  return d;
}

function place(pl){
  if (!svg || !path || !length) return;

  const s = wrap(pl.s, length);
  const pLocal = path.getPointAtLength(s);

  const s2 = wrap(s + 2.5, length);
  const p2 = path.getPointAtLength(s2);

  let tx = (p2.x - pLocal.x), ty = (p2.y - pLocal.y);
  const tl = Math.hypot(tx, ty) || 1;
  tx /= tl; ty /= tl;

  let nx = -ty, ny = tx;

  const maxOff = Math.max(0, TRACK_HALF_WIDTH - CAR_RADIUS);
  pl.off = Math.max(-maxOff, Math.min(maxOff, pl.off));

  const shifted = { x: pLocal.x + nx * pl.off, y: pLocal.y + ny * pl.off };

  const ctm = path.getScreenCTM();
  if (!ctm) return;

  const pt = svg.createSVGPoint();
  pt.x = shifted.x; pt.y = shifted.y;
  const p = pt.matrixTransform(ctm);

  pl.el.style.left = p.x + "px";
  pl.el.style.top  = p.y + "px";

  const ang = Math.atan2(ty, tx) * 180 / Math.PI;
  pl.el.style.transform = `translate(-50%,-50%) scale(0.82) rotate(${ang}deg)`;
}

function findLowestPointS(pathEl, len){
  let bestS=0, bestY=-Infinity;
  const step = Math.max(2, len/1800);
  for (let s=0; s<=len; s+=step){
    const p = pathEl.getPointAtLength(s);
    if (p.y > bestY){ bestY = p.y; bestS = s; }
  }
  const a = Math.max(0, bestS-step), b = Math.min(len, bestS+step);
  for (let s=a; s<=b; s+=step/10){
    const p = pathEl.getPointAtLength(s);
    if (p.y > bestY){ bestY = p.y; bestS = s; }
  }
  return bestS;
}

    if (!pathIsClosed) {
      trackOverlay.insertAdjacentHTML("beforeend", `

        </div>
      `);
    }

    startS = findLowestPointS(path, length);

    players.p1.s = wrap(startS, length);

    players.p1.off = -5;
    players.p2.off = +5;

    steerAngleP1 = angleDegAtS(players.p1.s);
    steerAngleP2 = angleDegAtS(players.p2.s);

    lkwEl.style.display="block";

    place(players.p1);
    place(players.p2);

    raceState = "idle";

    ensureLoop();

    trackOverlay.innerHTML = `
      <div data-trackbox="1" style="position:fixed;left:20px;top:20px;...
                  background:rgba(0,0,0,0.75);color:#fff;font:14px/1.4 system-ui;
                  border-radius:10px;max-width:70ch;">

        <code>${escapeHtml(err.message)}</code>
        <div style="margin-top:10px;opacity:.9">Klick ins Leere zum Schließen.</div>
      </div>`;
    svg=null; path=null; length=0;
    lkwEl.style.display="none";

/* =========================
   Main loop
   ========================= */
function ensureLoop(){
  if (raf) return;
  lastFrame = null;
  raf = requestAnimationFrame(tick);
}
ensureLoop();

function tick(t){
  raf = requestAnimationFrame(tick);

  mouseX = lerp(mouseX, mouseTx, MOUSE_SMOOTH);
  mouseY = lerp(mouseY, mouseTy, MOUSE_SMOOTH);
  updateCoords();

  if (!svg || !path || !length) { lastFrame = t; return; }

 if (raceState==="countdown"){
  const now = performance.now();

  const PRE_MS = 650;
  const STEP_MS = 1000;
  const GO_MS  = 520;

  const elapsed = Math.max(0, now - countdownStart);
  const total = PRE_MS + 3*STEP_MS + GO_MS;

  let phase = "";
  if (elapsed < PRE_MS) phase = "pre";
  else if (elapsed < PRE_MS + 1*STEP_MS) phase = "3";
  else if (elapsed < PRE_MS + 2*STEP_MS) phase = "2";
  else if (elapsed < PRE_MS + 3*STEP_MS) phase = "1";
  else if (elapsed < total) phase = "GO";
  else phase = "DONE";

  if (phase !== lastCountdownText){
    lastCountdownText = phase;

    if (phase === "pre"){
      raceCountdownEl.textContent = "";
      raceCountdownEl.style.fontSize = "96px";
      setTrafficLight("pre");     // ampel.png
    }
    else if (phase === "3"){
      raceCountdownEl.textContent = "3";
      raceCountdownEl.style.fontSize = "96px";
      setTrafficLight(1);         // ampel1.png
    }
    else if (phase === "2"){
      raceCountdownEl.textContent = "2";
      raceCountdownEl.style.fontSize = "96px";
      setTrafficLight(2);         // ampel2.png
    }
    else if (phase === "1"){
      raceCountdownEl.textContent = "1";
      raceCountdownEl.style.fontSize = "96px";
      setTrafficLight(3);         // ampel3.png
    }
    else if (phase === "GO"){
      // ✅ GO groß, nur Text
      raceCountdownEl.textContent = "GO";
      raceCountdownEl.style.fontSize = "160px";
      hideTrafficLight();
    }
  }

  if (phase === "DONE"){
    beginRace();
  }

  lastFrame = t;
  return;
}

  if (raceState!=="running"){ lastFrame = t; return; }

  if (lastFrame==null){ lastFrame=t; return; }
  const dt = (t-lastFrame)/1000;
  lastFrame = t;

  for (const id of ["p1","p2"]){
    const pl = players[id];
    if (pl.finished) continue;

    let speedFactor = 0;
    let gasPressed = false;

    if (id === "p1") {
      gasPressed = pl.keys.has("ArrowUp");
      const left  = pl.keys.has("ArrowLeft");
      const right = pl.keys.has("ArrowRight");

      if (left)  steerAngleP1 = (steerAngleP1 - STEER_SPEED * dt + 360) % 360;
      if (right) steerAngleP1 = (steerAngleP1 + STEER_SPEED * dt) % 360;

      const steer = (left ? -1 : 0) + (right ? +1 : 0);
      pl.offV += steer * OFF_ACCEL * dt;
      pl.offV *= Math.exp(-OFF_DRAG * dt);
      pl.off += pl.offV * dt;

      const aTrack = angleDegAtS(pl.s);
      const diff = Math.abs(angDiff(steerAngleP1, aTrack));
      speedFactor = clamp01(1 - (diff / ALIGN_TOL));
      speedFactor = speedFactor * speedFactor;
    } else {
      gasPressed = pl.keys.has("w");
      const left  = pl.keys.has("a");
      const right = pl.keys.has("d");

      if (left)  steerAngleP2 = (steerAngleP2 - STEER_SPEED * dt + 360) % 360;
      if (right) steerAngleP2 = (steerAngleP2 + STEER_SPEED * dt) % 360;

      const steer = (left ? -1 : 0) + (right ? +1 : 0);
      pl.offV += steer * OFF_ACCEL * dt;
      pl.offV *= Math.exp(-OFF_DRAG * dt);
      pl.off += pl.offV * dt;

      const aTrack = angleDegAtS(pl.s);
      const diff = Math.abs(angDiff(steerAngleP2, aTrack));
      speedFactor = clamp01(1 - (diff / ALIGN_TOL));
      speedFactor = speedFactor * speedFactor;
    }

    const wantsMove = gasPressed && speedFactor > 0.05;

    if (wantsMove && !pl.started){
      pl.started = true;
      pl.time = 0;
      pl.dist = 0;
      pl.lastRel = relToStart(pl.s);
      pl.v = 0;
    }

    if (pl.started && !pl.finished){
      pl.time += dt;

      const targetV = SPEED * speedFactor;

      if (gasPressed) pl.v += (targetV - pl.v) * clamp01(ACCEL * dt / Math.max(1, SPEED));
      else pl.v *= Math.exp(-DRAG * dt);

      if (speedFactor < 0.15) pl.v *= Math.exp(-BRAKE * dt);

      const ds = pl.v * dt;
      if (ds > 0.001) {
        pl.s = pathIsClosed ? wrap(pl.s + ds, length) : Math.min(pl.s + ds, length);
        pl.dist += ds;
        place(pl);

        const rel = relToStart(pl.s);
        const crossedStart = (rel < pl.lastRel);
        pl.lastRel = rel;

        if (!pl.finished && pl.dist >= length*0.90 && crossedStart){
          pl.finished = true;
          lastScore[id] = pl.time;
          if (id==="p1"){
            scoreLkwEl.textContent = fmt(pl.time);
            if (finishLkwEl) finishLkwEl.style.display = "inline-block";
          }
          if (id==="p2"){
            scoreCarEl.textContent = fmt(pl.time);
            if (finishCarEl) finishCarEl.style.display = "inline-block";
          }
          finishIfBoth();
        }
      }
    }
  }

  timerLkwEl.textContent = fmt(players.p1.time);
  timerCarEl.textContent = fmt(players.p2.time);
}

function makeRain(){
  const drops = [];

  // Basis-Setup
  const cfg = { baseCount: 280, grav: 820, stretch: 1.08 };

  // Intensity-Ramp (0..1) → steuert nur Spawnmenge, keine Transparenz
  let intensity = 0;
  let targetIntensity = 0;
  const RAMP_RATE = 0.55; // höher = schneller Start/Stop

  let angleDeg = 0;
  let windX = 0;
  let angleHold = 0;

  function pickNewAngle(){
    const range = WX.wind ? WX.rainAngleRangeWind : WX.rainAngleRange;
    angleDeg = rand(-range, range);
    windX = -Math.tan(angleDeg * Math.PI/180) * WX.rainWindBase;
    angleHold = WX.wind ? rand(3.5, 9.0) : rand(6, 16);
  }

  function spawn(){
    const img = pick(IMG.rain);
    const scale = (img === IMG.rain[0]) ? rand(0.035,0.070)
                : (img === IMG.rain[1]) ? rand(0.045,0.090)
                :                        rand(0.055,0.110);

    drops.push({ img, x: rand(-120, W+120), y: rand(-H, 0), vy: rand(520, 1150), scale });
  }

  // ✅ nur nach oben auffüllen. Beim Runterfahren NICHT löschen → läuft natürlich aus.
  function ensureTargetCount(){
    const targetCount = Math.round(cfg.baseCount * intensity);
    while (drops.length < targetCount) spawn();
  }

  function setIntensity(v){
    targetIntensity = Math.max(0, Math.min(1, v));
    // wenn Start aus 0 → sauberer Beginn
    if (targetIntensity > 0 && drops.length === 0) pickNewAngle();
  }

  return {
    start(){
      drops.length = 0;
      intensity = 0;
      targetIntensity = 0;
      pickNewAngle();
    },
    setIntensity,
    update(dt){
      // intensity rampen (exponentiell smooth)
      intensity += (targetIntensity - intensity) * (1 - Math.exp(-RAMP_RATE * dt));

      ensureTargetCount();

      angleHold -= dt;
      if (angleHold <= 0) pickNewAngle();

      for (let i=drops.length-1; i>=0; i--){
        const d = drops[i];
        d.vy += cfg.grav * dt;
        d.x  += windX * dt;
        d.y  += d.vy * dt;
        if (d.y > H + 200 || d.x < -260 || d.x > W + 260){
          drops.splice(i,1);
          // ✅ nur respawnen wenn wir “noch brauchen”
          const targetCount = Math.round(cfg.baseCount * intensity);
          if (drops.length < targetCount) spawn();
        }
      }
    },
    draw(){
      // ✅ keine Transparenz-Fades hier
      for (const d of drops){
        const im = d.img;
        if (!im.complete || !im.naturalWidth) continue;

        const w = im.naturalWidth  * d.scale;
        const h = im.naturalHeight * d.scale * cfg.stretch;

        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(angleDeg * Math.PI/180);
        ctx.drawImage(im, -w/2, -h/2, w, h);
        ctx.restore();
      }
    }
  };
}

  let intensity = 0;
  let targetIntensity = 0;
  const RAMP_RATE = 0.55;

  function spawn(){
    if (!IMG.arte || !IMG.arte.length) return;

    const img = pick(IMG.arte);
    const scale = rand(0.07, 0.10);

    drops.push({
      img,
      x: rand(-120, W+120),
      y: rand(-H, 0),
      vy: rand(420, 820),
      scale,
      rot: rand(0, TAU),
      spin: rand(-1.2, 1.2),
    });
  }

  function ensureTargetCount(){
    const targetCount = Math.round(cfg.baseCount * intensity);
    while (drops.length < targetCount) spawn();
  }

  function setIntensity(v){
    targetIntensity = Math.max(0, Math.min(1, v));
  }

  return {
    start(){ drops.length = 0; intensity = 0; targetIntensity = 0; },
    setIntensity,
    update(dt){
      intensity += (targetIntensity - intensity) * (1 - Math.exp(-RAMP_RATE * dt));

      ensureTargetCount();

      for (let i=drops.length-1; i>=0; i--){
        const d = drops[i];
        d.vy += cfg.grav * dt;
        d.y  += d.vy * dt;
        d.rot += d.spin * dt;

        if (d.y > H + 200){
          drops.splice(i,1);
          const targetCount = Math.round(cfg.baseCount * intensity);
          if (drops.length < targetCount) spawn();
        }
      }
    },
    draw(){
      for (const d of drops){
        const im = d.img;
        if (!im.complete || !im.naturalWidth) continue;
        const w = im.naturalWidth  * d.scale;
        const h = im.naturalHeight * d.scale;

        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rot);
        ctx.drawImage(im, -w/2, -h/2, w, h);
        ctx.restore();
      }
    }
  };
}
  function makeSnow(){
  const flakes = [];
  let cfg = null;

  let intensity = 0;
  let targetIntensity = 0;
  const RAMP_RATE = 0.55;

  function setRandomSnowMode(){
    if (WX.wind){
      cfg = { baseCount: 520, wind: rand(-190,-90), grav: rand(260,520), drift: 3.2, sway: 2.1 };
      return;
    }
    const blizzard = Math.random() < WX.snowBlizzardChance;
    cfg = blizzard
      ? { baseCount: 380, wind: rand(-140,-60), grav: rand(220,420), drift: 2.6, sway: 1.8 }
      : { baseCount: 190, wind: rand(-45, 15),  grav: rand(80, 170),  drift: 1.2, sway: 1.0 };
  }

  function spawn(){
    const img = pick(IMG.snow);
    const scale = (img === IMG.snow[0]) ? rand(0.08,0.18) : rand(0.06,0.16);
    flakes.push({
      img, x: rand(-60, W+60), y: rand(-H, 0),
      vx: rand(cfg.wind-30, cfg.wind+30),
      vy: rand(cfg.grav*0.7, cfg.grav*1.4),
      scale, phase: rand(0, TAU),
      spin: rand(-0.35, 0.35),
      rot: rand(0, TAU),
    });
  }

  function ensureTargetCount(){
    const targetCount = Math.round(cfg.baseCount * intensity);
    while (flakes.length < targetCount) spawn();
  }

  function setIntensity(v){
    targetIntensity = Math.max(0, Math.min(1, v));
  }

  return {
    start(){ setRandomSnowMode(); flakes.length = 0; intensity = 0; targetIntensity = 0; },
    setIntensity,
    update(dt, tSec){
      if (!cfg) setRandomSnowMode();

      intensity += (targetIntensity - intensity) * (1 - Math.exp(-RAMP_RATE * dt));
      ensureTargetCount();

      for (let i=flakes.length-1; i>=0; i--){
        const f = flakes[i];
        const sway = Math.sin(f.phase + tSec*cfg.sway) * (22 * cfg.drift);
        f.x += (f.vx * dt) + (sway * dt);
        f.y += f.vy * dt;
        f.rot += f.spin * dt;

        if (f.y > H + 120 || f.x < -220 || f.x > W + 220){
          flakes.splice(i,1);
          const targetCount = Math.round(cfg.baseCount * intensity);
          if (flakes.length < targetCount) spawn();
        }
      }
    },
    draw(){
      for (const f of flakes){
        const im = f.img;
        if (!im.complete || !im.naturalWidth) continue;
        const w = im.naturalWidth  * f.scale;
        const h = im.naturalHeight * f.scale;

        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rot);
        ctx.drawImage(im, -w/2, -h/2, w, h);
        ctx.restore();
      }
    }
  };
}

  function makeClouds(){
    const clouds = [];
    let gust = 1;
    let gustT = 0;

    function spawnCloud(fast=false){
      const img = pick(IMG.clouds);
      const scale = rand(0.35, 1.00);
      const baseV = fast ? rand(90, 180) : rand(8, 24);

      clouds.push({
        img, scale,
        x: rand(-W*0.6, -120),
        y: rand(-H*0.06, H*0.55),
        vx: baseV,
        a: 0,
        targetA: rand(0.50, 0.92),
        life: 0,
        fadeInDur: rand(3.0, 6.5),
        outAt: rand(22, 60),
        fadeOutDur: rand(3.0, 6.5),
      });
    }

    function ensure(){
      const target = cloudsForceDense ? 14 : 7;
      while (clouds.length < target) spawnCloud(false);
      while (clouds.length > target) clouds.pop();
    }

    return {
      start(){ clouds.length = 0; ensure(); gust=1; gustT=0; },
      update(dt){
        ensure();

        if (gustT <= 0 && Math.random() < 0.01){
          gustT = rand(1.4, 3.2);
          gust = rand(2.2, 4.0);
          if (Math.random() < 0.7) spawnCloud(true);
          if (Math.random() < 0.35) spawnCloud(true);
        }
        if (gustT > 0){
          gustT -= dt;
          if (gustT <= 0){ gustT = 0; gust = 1; }
        }

        for (let i=clouds.length-1; i>=0; i--){
          const c = clouds[i];
          c.life += dt;
          c.x += c.vx * dt * gust * WX.cloudSpeedMult;

          const fin = clamp01(c.life / (c.fadeInDur || 4.5));
          const fadeIn = easeInOut(fin);

          const foutRaw = (c.life > c.outAt) ? clamp01((c.life - c.outAt) / (c.fadeOutDur || 4.5)) : 0;
          const fadeOut = 1 - easeInOut(foutRaw);

          const breathe = 0.96 + Math.sin(c.life * 0.45) * 0.04;
          c.a = c.targetA * fadeIn * fadeOut * breathe;

          if (c.x > W + 420 || fadeOut <= 0.001){
            clouds.splice(i,1);
            spawnCloud(false);
          }
        }
      },
      draw(alpha){
        if (alpha <= 0.001) return;
        ctx.save();
        for (const c of clouds){
          const im = c.img;
          if (!im.complete || !im.naturalWidth) continue;
          const w = im.naturalWidth  * c.scale;
          const h = im.naturalHeight * c.scale;
          const darken = cloudsForceDense ? 1.35 : 1;
          ctx.globalAlpha = alpha * c.a * darken;
          ctx.drawImage(im, c.x, c.y, w, h);
        }
        ctx.restore();
      }
    };
  }

  function makeSun(){
    let a = 0;
    let fadeSpeed = 0.35;
    return {
      start(){ a=0; fadeSpeed = rand(0.18, 0.38); },
      update(dt){ a = Math.min(1, a + fadeSpeed * dt); },
      draw(alpha){
        const im = IMG.sun[0];
        if (!im || !im.complete || !im.naturalWidth) return;
        const baseScale = Math.min(W, H) / 1200;
        const scale = baseScale * 0.9;
        const w = im.naturalWidth  * scale;
        const h = im.naturalHeight * scale;
        const x = W - w - 80;
        const y = 60;
        ctx.save();
        ctx.globalAlpha = alpha * a;
        ctx.drawImage(im, x, y, w, h);
        ctx.restore();
      }
    };
  }

      function drawRainbow(alpha){
    const im = IMG.rainbow?.[0];
    if (!im || !im.complete || !im.naturalWidth) return;
    if (alpha <= 0.001) return;

    // Größer als Bildschirm → geht über Rand hinaus
    const targetW = Math.max(W * 1.25, 1400);
    const scale = targetW / im.naturalWidth;
    const w = im.naturalWidth * scale;
    const h = im.naturalHeight * scale;

    // Horizontal zentriert
    const x = (W - w) / 2;

    // Weiter nach unten → unterer Bildschirmbereich
    // (großer Teil liegt unterhalb des Screens → wirkt wie echter Horizontbogen)
    const y = H - h * 0.55;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(im, x, y, w, h);
    ctx.restore();

  }


  const ENGINES = {
    rain: makeRain(),
    snow: makeSnow(),
    arte: makeArteRain(),
    clouds: makeClouds(),
    sun: makeSun()
  };

  window.addEventListener("typewriterstart", () => {
    skyCloudsOn = true;
    ENGINES.clouds.start();
    cloudsForceDense = true;
    gustBoost = 1.4;
    gustBoostT = 1.6;
  });

  function updateWeatherAudio(){
    if (WX.wind){ playWeather("audio/wind1.wav"); return; }
    const rainActive = (precipCurr === "rain") || (precipNext === "rain");
    if (rainActive){ playWeather("audio/regen1.wav"); return; }
    stopWeather();
  }

  let running = false;
  let tSec = 0;
  let lastMs = null;
  let rainbowAlpha = 0; // 0..1, eigener Fade für Regenbogen

  let gustBoost = 1;
  let gustBoostT = 0;
  let cloudsForceDense = false;

  let skySunOn = false;
  let skyCloudsOn = false;

  let precipCurr = "none";

  let nextSwitchAt = 0;
  function scheduleNext(){ nextSwitchAt = tSec + rand(10, 60); }

  /* TEST: Artefakt oft (für später wieder runterdrehen) */
  function pickPrecipNext(){
    const r = Math.random();
    if (r < 0.15) return "none";
    if (r < 0.30) return "rain";
    if (r < 0.45) return "snow";
    return "arte";
  }

  function toggleSkyRandom(){
    const clouds = Math.random() < 0.75;
    const sun = Math.random() < 0.35;

    const sunChanged = (sun !== skySunOn);
    const cloudsChanged = (clouds !== skyCloudsOn);

    skySunOn = sun;
    skyCloudsOn = clouds;

    if (sunChanged && skySunOn) ENGINES.sun.start();
    if (cloudsChanged && skyCloudsOn) ENGINES.clouds.start();
  }

  function startSystem(){
    if (running) return;
    running = true;

    /* ✅ auch arte kann initial sein */
    const initR = Math.random();
    precipCurr = initR < 0.45 ? "rain" : initR < 0.80 ? "snow" : "arte";
    precipNext = precipCurr;
    precipT = 1;

    setWind(Math.random() < 0.25);
    toggleSkyRandom();

    if (precipCurr !== "none") ENGINES[precipCurr].start();
    if (skyCloudsOn) ENGINES.clouds.start();

    scheduleNext();
    updateWeatherAudio();

    requestAnimationFrame(frame);
  }

  function stopSystem(){
    running = false;
    cloudsForceDense = false;
    skySunOn = false;
    skyCloudsOn = false;
    precipCurr = "none";
    precipNext = null;
    precipFading = false;
    precipT = 1;
    lastMs = null;
    ctx.clearRect(0,0,W,H);
  }

  function setPrecip(type){
  type = type || "none";
  if (type === precipCurr) { scheduleNext(); return; }

  // alte precipitation auslaufen lassen
  if (precipCurr !== "none") ENGINES[precipCurr]?.setIntensity?.(0);

  precipCurr = type;

  // neue precipitation “vereinzelt” starten
  if (precipCurr !== "none"){
    ENGINES[precipCurr].start();
    ENGINES[precipCurr].setIntensity(1);
  }

  scheduleNext();
}

  function frame(ms){
    requestAnimationFrame(frame);
    if (!running) return;

    if (lastMs == null) lastMs = ms;
    const dt = Math.min(0.033, (ms - lastMs)/1000);
    lastMs = ms;
    tSec += dt;

    if (tSec >= nextSwitchAt){
      setWind(Math.random() < 0.25);
      toggleSkyRandom();
      setPrecip(pickPrecipNext());
      updateWeatherAudio();
    }

    if (skySunOn) ENGINES.sun.update?.(dt, tSec);

    if (gustBoostT > 0){
      gustBoostT -= dt;
      if (gustBoostT <= 0){ gustBoostT = 0; gustBoost = 1; }
    }
    if (skyCloudsOn) ENGINES.clouds.update?.(dt * gustBoost, tSec);

    if (precipCurr !== "none") ENGINES[precipCurr].update?.(dt, tSec);
    if (precipNext && precipNext !== "none") ENGINES[precipNext].update?.(dt, tSec);

   ctx.clearRect(0,0,W,H);

const sunAlpha = skyCloudsOn ? 0.38 : 1.0;

// Sonne zuerst (behält Fade aus makeSun)
if (skySunOn) ENGINES.sun.draw?.(sunAlpha);

// Regenbogen-Fade (unabhängig von Precip-Alpha)
const wantRainbow = skySunOn && (precipCurr === "rain");
const rbTarget = wantRainbow ? 1 : 0;
// 0.9 = recht flott, 0.5 = langsamer
rainbowAlpha += (rbTarget - rainbowAlpha) * (1 - Math.exp(-0.9 * dt));

if (rainbowAlpha > 0.01){
  drawRainbow(Math.min(1, rainbowAlpha) * 0.85);
}

// Wolken danach (behält Fade pro Wolke aus makeClouds)
if (skyCloudsOn) ENGINES.clouds.draw?.(1);

// Niederschlag zuletzt (ohne Transparenz-Fade; Engine macht Dichte-Ramp)
if (precipCurr !== "none") ENGINES[precipCurr].draw?.();

  }

  window.addEventListener("idleenter", () => {
    stopAllVehicleSounds();
    stopAllClickSounds();
    stopWeather();
    masterAmbient.stop();

    if (running) return;
    startSystem();
    updateWeatherAudio();
  });

  window.addEventListener("idleleave", () => {
    stopSystem();
    stopWeather();
    masterAmbient.tryPlay();
  });
})();
</script>
